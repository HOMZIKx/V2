openapi: 3.1.0
info:
  title: Discord Gateway — Technika bot config (D-060)
  version: 1.0.0
  description: |
    Versioned, safe bot configuration for Technika.
    Mutating endpoints require x-technika-secret matching
    DISCORD_TECHNIKA_SHARED_SECRET.
servers:
  - url: http://127.0.0.1:4100
    description: Local discord-gateway

tags:
  - name: capabilities
  - name: config
  - name: guilds

paths:
  /discord/v1/capabilities:
    get:
      tags: [capabilities]
      operationId: listBotCapabilities
      summary: Lista capability bota
      responses:
        '200':
          description: Katalog capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'

  /discord/v1/config:
    get:
      tags: [config]
      operationId: getActiveBotConfig
      summary: Aktywna konfiguracja i revision
      responses:
        '200':
          description: Active snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigSnapshot'

  /discord/v1/config/draft:
    put:
      tags: [config]
      operationId: putBotConfigDraft
      summary: Zapisz partial draft konfiguracji
      security:
        - TechnikaSecret: []
      parameters:
        - $ref: '#/components/parameters/TechnikaSecretHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/BotConfig'
                - type: object
                  required: [config]
                  properties:
                    config:
                      $ref: '#/components/schemas/BotConfigPartial'
      responses:
        '200':
          description: Draft zapisany
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftResponse'
        '400':
          description: Walidacja nieudana
        '401':
          description: Brak lub zły x-technika-secret

  /discord/v1/config/validate:
    post:
      tags: [config]
      operationId: validateBotConfig
      summary: Waliduj body lub bieżący draft
      security:
        - TechnikaSecret: []
      parameters:
        - $ref: '#/components/parameters/TechnikaSecretHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/BotConfig'
                - type: object
                  properties:
                    config:
                      $ref: '#/components/schemas/BotConfig'
      responses:
        '200':
          description: Wynik walidacji
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '401':
          description: Brak lub zły secret

  /discord/v1/config/preview:
    post:
      tags: [config]
      operationId: previewBotConfig
      summary: Podgląd active vs draft
      security:
        - TechnikaSecret: []
      parameters:
        - $ref: '#/components/parameters/TechnikaSecretHeader'
      responses:
        '200':
          description: Preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewResponse'
        '401':
          description: Brak lub zły secret

  /discord/v1/config/apply:
    post:
      tags: [config]
      operationId: applyBotConfig
      summary: Promuj draft do active
      security:
        - TechnikaSecret: []
      parameters:
        - $ref: '#/components/parameters/TechnikaSecretHeader'
      responses:
        '200':
          description: Active po apply
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [ok]
                    properties:
                      ok: { type: boolean, const: true }
                  - $ref: '#/components/schemas/ConfigSnapshot'
        '400':
          description: Draft nie przeszedł walidacji
        '401':
          description: Brak lub zły secret

  /discord/v1/config/rollback:
    post:
      tags: [config]
      operationId: rollbackBotConfig
      summary: Cofnij do poprzedniej rewizji
      security:
        - TechnikaSecret: []
      parameters:
        - $ref: '#/components/parameters/TechnikaSecretHeader'
      responses:
        '200':
          description: Active po rollback
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [ok]
                    properties:
                      ok: { type: boolean, const: true }
                  - $ref: '#/components/schemas/ConfigSnapshot'
        '401':
          description: Brak lub zły secret
        '409':
          description: Brak poprzedniej rewizji

  /discord/v1/config/test-dm:
    post:
      tags: [config]
      operationId: postBotConfigTestDm
      summary: Wyślij testową wiadomość prywatną Discord
      security:
        - TechnikaSecret: []
      parameters:
        - $ref: '#/components/parameters/TechnikaSecretHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestDmRequest'
      responses:
        '200':
          description: Wysłano lub soft-skip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestDmResponse'
        '400':
          description: Walidacja nieudana
        '401':
          description: Brak lub zły x-technika-secret
        '503':
          description: Discord niedostępny lub wyłączony

  /discord/v1/guilds/{guildId}/roles:
    get:
      tags: [guilds]
      operationId: listTechnikaGuildRoles
      summary: Lista ról guildii
      security:
        - TechnikaSecret: []
      parameters:
        - $ref: '#/components/parameters/TechnikaSecretHeader'
        - name: guildId
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{17,20}$'
      responses:
        '200':
          description: Role guildii
          content:
            application/json:
              schema:
                type: object
                required: [ok, guildId, roles]
                properties:
                  ok: { type: boolean }
                  guildId: { type: string }
                  roles:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: { type: string }
                        name: { type: string }
        '401':
          description: Unauthorized

components:
  securitySchemes:
    TechnikaSecret:
      type: apiKey
      in: header
      name: x-technika-secret

  parameters:
    TechnikaSecretHeader:
      name: x-technika-secret
      in: header
      required: true
      schema:
        type: string
      description: Shared secret matching DISCORD_TECHNIKA_SHARED_SECRET

  schemas:
    CapabilityField:
      type: object
      required: [key, title, description, valueType, default]
      properties:
        key: { type: string }
        title: { type: string }
        description: { type: string }
        valueType:
          type: string
          enum: [boolean, number, string]
        default: {}

    Capability:
      type: object
      required: [id, title, description, valueType, default]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        valueType:
          type: string
          enum: [boolean, number, string, object]
        default: {}
        readOnly: { type: boolean }
        currentDisplayValue: {}
        fields:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityField'

    CapabilitiesResponse:
      type: object
      required: [capabilities]
      properties:
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'

    CharacterTimers:
      type: object
      required: [enabled, messageTemplate, reminderMinutesBefore, resetNotifyEnabled]
      properties:
        enabled: { type: boolean }
        messageTemplate: { type: string, maxLength: 1800 }
        reminderMinutesBefore:
          type: integer
          minimum: 1
          maximum: 1440
        resetNotifyEnabled: { type: boolean }

    TimersNotify:
      $ref: '#/components/schemas/CharacterTimers'

    KingdomWar:
      type: object
      required: [enabled, warAt, notifyMinutesBefore, maxClaimsPerUser, messageTemplate]
      properties:
        enabled: { type: boolean }
        warAt:
          type: string
          pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
        notifyMinutesBefore:
          type: integer
          minimum: 1
          maximum: 1440
        maxClaimsPerUser:
          type: integer
          minimum: 1
          maximum: 20
        messageTemplate: { type: string, maxLength: 1800 }

    MemberActivity:
      type: object
      required: [enabled, guildId, memberRoleIds, windowDays, topN]
      properties:
        enabled: { type: boolean }
        guildId:
          type: string
          pattern: '^\d{17,20}$'
        memberRoleIds:
          type: array
          maxItems: 100
          items:
            type: string
            pattern: '^\d{17,20}$'
        windowDays:
          type: integer
          enum: [7, 14, 30]
        topN:
          type: integer
          minimum: 1
          maximum: 500

    PublishChannels:
      type: object
      additionalProperties: false
      properties:
        centrumHub: { type: string, pattern: '^\d{17,20}$' }
        notifications: { type: string, pattern: '^\d{17,20}$' }
        dungeons: { type: string, pattern: '^\d{17,20}$' }
        trade: { type: string, pattern: '^\d{17,20}$' }
        recurring: { type: string, pattern: '^\d{17,20}$' }
        events: { type: string, pattern: '^\d{17,20}$' }
        website: { type: string, pattern: '^\d{17,20}$' }

    SeedReaction:
      type: object
      required: [emoji, role]
      additionalProperties: false
      properties:
        emoji: { type: string }
        role:
          type: string
          enum: [decorative, rsvp_yes, rsvp_no, rsvp_maybe, count]
        label: { type: string, maxLength: 80 }

    RecurringSchedule:
      type: object
      required: [mode, daysOfWeek, timeWarsaw, horizonDays]
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [daily, weekly, days]
        daysOfWeek:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
        timeWarsaw:
          type: string
          pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
        horizonDays:
          type: integer
          minimum: 1
          maximum: 90

    RecurringPostRules:
      type: object
      additionalProperties: false
      required: [whoCanReact]
      properties:
        maxSlots:
          type: [integer, 'null']
          minimum: 1
          maximum: 9999
        closeAt:
          type: string
          enum: [none, at_start, manual]
        whoCanReact:
          type: string
          enum: [everyone, roles]
        roleIds:
          type: array
          maxItems: 50
          items:
            type: string
            pattern: '^\d{17,20}$'

    RecurringPosts:
      type: object
      additionalProperties: false
      required:
        - enabled
        - title
        - content
        - schedule
        - channelId
        - seedReactions
        - showCountsInPost
        - rsvpEnabled
        - rules
      properties:
        enabled: { type: boolean }
        title: { type: string, maxLength: 100 }
        content: { type: string, maxLength: 2000 }
        schedule:
          $ref: '#/components/schemas/RecurringSchedule'
        channelId: { type: string }
        seedReactions:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/SeedReaction'
        showCountsInPost: { type: boolean }
        rsvpEnabled: { type: boolean }
        rules:
          $ref: '#/components/schemas/RecurringPostRules'

    GuildModules:
      type: object
      additionalProperties: false
      required: [characterTimers, kingdomWar, panels, channels]
      properties:
        characterTimers: { type: boolean }
        kingdomWar: { type: boolean }
        panels: { type: boolean }
        channels: { type: boolean }

    GuildConfig:
      type: object
      additionalProperties: false
      required: [enabled, modules, rights]
      properties:
        enabled: { type: boolean }
        displayName: { type: string, maxLength: 100 }
        modules:
          $ref: '#/components/schemas/GuildModules'
        rights:
          type: array
          items: { type: string }
        notes: { type: string, maxLength: 500 }
        publishChannels:
          $ref: '#/components/schemas/PublishChannels'
        appWebsiteUrl: { type: string, maxLength: 500 }

    BotConfig:
      type: object
      additionalProperties: false
      required:
        - panel-test-enabled
        - notify-timer-enabled
        - timersNotify
        - characterTimers
        - kingdomWar
        - notify-timer-dm-action-buttons
        - guilds
        - memberActivity
        - publishChannels
        - recurringPosts
      properties:
        panel-test-enabled: { type: boolean }
        notify-timer-enabled: { type: boolean }
        timersNotify:
          $ref: '#/components/schemas/TimersNotify'
        characterTimers:
          $ref: '#/components/schemas/CharacterTimers'
        kingdomWar:
          $ref: '#/components/schemas/KingdomWar'
        notify-timer-dm-action-buttons: { type: boolean }
        guilds:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/GuildConfig'
        memberActivity:
          $ref: '#/components/schemas/MemberActivity'
        publishChannels:
          $ref: '#/components/schemas/PublishChannels'
        recurringPosts:
          $ref: '#/components/schemas/RecurringPosts'

    BotConfigPartial:
      type: object
      description: Partial merge; brakujące klucze dziedziczone z active lub draft
      properties:
        panel-test-enabled: { type: boolean }
        notify-timer-enabled: { type: boolean }
        timersNotify:
          type: object
          additionalProperties: true
        characterTimers:
          type: object
          additionalProperties: true
        kingdomWar:
          type: object
          additionalProperties: true
        notify-timer-dm-action-buttons: { type: boolean }
        guilds:
          type: object
          additionalProperties: true
        memberActivity:
          type: object
          additionalProperties: true
        publishChannels:
          type: object
          additionalProperties: true
        recurringPosts:
          type: object
          additionalProperties: true

    ConfigSnapshot:
      type: object
      required: [revision, status, config, updatedAt, hasDraft, canRollback]
      properties:
        revision: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [active, draft]
        config:
          $ref: '#/components/schemas/BotConfig'
        updatedAt:
          type: string
          format: date-time
        hasDraft: { type: boolean }
        canRollback: { type: boolean }
        strictGuildIsolation: { type: boolean }

    ValidationIssue:
      type: object
      required: [path, message]
      properties:
        path: { type: string }
        message: { type: string }

    DraftResponse:
      type: object
      required: [ok, revision, status, config, issues, updatedAt]
      properties:
        ok: { type: boolean }
        revision: { type: integer }
        status:
          type: string
          enum: [draft]
        config:
          $ref: '#/components/schemas/BotConfig'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
        updatedAt:
          type: string
          format: date-time

    ValidationResponse:
      type: object
      required: [ok, issues]
      properties:
        ok: { type: boolean }
        config:
          oneOf:
            - $ref: '#/components/schemas/BotConfig'
            - type: 'null'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'

    PreviewResponse:
      type: object
      required: [ok, revision, status, active, draft, wouldBecomeRevision, issues, updatedAt]
      properties:
        ok: { type: boolean }
        revision: { type: integer }
        status:
          type: string
          enum: [active, draft]
        active:
          $ref: '#/components/schemas/BotConfig'
        draft:
          oneOf:
            - $ref: '#/components/schemas/BotConfig'
            - type: 'null'
        wouldBecomeRevision:
          oneOf:
            - type: integer
            - type: 'null'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
        updatedAt:
          type: string
          format: date-time

    TestDmRequest:
      type: object
      required: [module, discordAccountId]
      properties:
        module:
          type: string
          enum: [characterTimers, kingdomWar]
        discordAccountId:
          type: string
          pattern: '^\d{17,20}$'
        messageTemplate:
          type: string
          maxLength: 1800
        sampleVars:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number

    TestDmResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        delivery:
          type: string
          enum: [dm]
        messageId:
          type: [string, 'null']
        skipped:
          type: string
          enum: [dms_closed]
        renderedPreview: { type: string }
