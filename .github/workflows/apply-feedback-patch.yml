name: Apply isolated user feedback patch

on:
  push:
    branches:
      - fix/feedback-eq-hunts-timers-20260908
    paths:
      - .github/workflows/apply-feedback-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/feedback-eq-hunts-timers-20260908
          fetch-depth: 0
      - name: Apply exact-match patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # EQ V2: conservative catalog matching — never pick the first fuzzy hit blindly.
          replace(
              'apps/web/app/teams/[teamId]/characters/[characterId]/character-equipment-v2.tsx',
              """      const best =\n        matches.find(\n          (item) =>\n            item.title.trim().toLocaleLowerCase('pl') === baseName.trim().toLocaleLowerCase('pl'),\n        ) ?? matches[0] ?? null;\n      const bestSlot = best ? equipmentSlotForCategory(best.category) : null;\n      const analyzedSlot = bestSlot ?? payload.draft.category ?? null;\n\n      setSelectedCatalogId(best?.id ?? null);\n      setCategoryReviewRequired(analyzedSlot === null);\n""",
              """      const normalizedBaseName = baseName.trim().toLocaleLowerCase('pl');\n      const exactMatches = matches.filter(\n        (item) => item.title.trim().toLocaleLowerCase('pl') === normalizedBaseName,\n      );\n      const sameSlotMatches = payload.draft.category\n        ? matches.filter((item) => equipmentSlotForCategory(item.category) === payload.draft.category)\n        : matches;\n      const best =\n        exactMatches.length === 1\n          ? exactMatches[0]!\n          : sameSlotMatches.length === 1\n            ? sameSlotMatches[0]!\n            : null;\n      const bestSlot = best ? equipmentSlotForCategory(best.category) : null;\n      const analyzedSlot = bestSlot ?? payload.draft.category ?? null;\n\n      setSelectedCatalogId(best?.id ?? null);\n      setCategoryReviewRequired(analyzedSlot === null);\n""",
          )

          replace(
              'apps/web/app/teams/[teamId]/characters/[characterId]/character-equipment-v2.tsx',
              """function clampEnhancement(value: number): number {\n  if (!Number.isFinite(value)) return 0;\n  return Math.min(9, Math.max(0, Math.trunc(value)));\n}\n\nfunction itemImage(item: EquipmentItem) {\n""",
              """function clampEnhancement(value: number): number {\n  if (!Number.isFinite(value)) return 0;\n  return Math.min(9, Math.max(0, Math.trunc(value)));\n}\n\nfunction startsSocketGroup(value: string): boolean {\n  const line = value.trim();\n  return /^(?:Kamień Duszy|Kamien Duszy)\\b/iu.test(line) ||\n    /^(?:Białe Złoto|Biale Zloto|Złoto|Zloto|Srebro|Miedź|Miedz|Jadeit|Heban|Ametyst|Kryształ|Krysztal|Niebiańskie Łzy|Niebiańskie Lzy)\\b/iu.test(line);\n}\n\nfunction splitDisplayedBonuses(lines: readonly string[]): {\n  readonly regular: readonly string[];\n  readonly sockets: readonly string[];\n} {\n  const firstSocket = lines.findIndex(startsSocketGroup);\n  if (firstSocket < 0) return { regular: lines, sockets: [] };\n  return { regular: lines.slice(0, firstSocket), sockets: lines.slice(firstSocket) };\n}\n\nfunction itemImage(item: EquipmentItem) {\n""",
          )

          replace(
              'apps/web/app/teams/[teamId]/characters/[characterId]/character-equipment-v2.tsx',
              """  const selectedItem = selectedItemId ? itemById.get(selectedItemId) ?? null : null;\n  const selectedEquipLocation =\n    selectedItemId && workspace ? equipLocations.get(selectedItemId) ?? null : null;\n\n  const catalogSuggestions = useMemo(() => {\n""",
              """  const selectedItem = selectedItemId ? itemById.get(selectedItemId) ?? null : null;\n  const selectedEquipLocation =\n    selectedItemId && workspace ? equipLocations.get(selectedItemId) ?? null : null;\n  const selectedBonusGroups = selectedItem\n    ? splitDisplayedBonuses(selectedItem.bonuses)\n    : { regular: [] as readonly string[], sockets: [] as readonly string[] };\n\n  const catalogSuggestions = useMemo(() => {\n""",
          )

          replace(
              'apps/web/app/teams/[teamId]/characters/[characterId]/character-equipment-v2.tsx',
              """                <div className={styles.bonusBlock}>\n                  <span>Bonusy</span>\n                  {selectedItem.bonuses.length > 0 ? (\n                    <ul>\n                      {selectedItem.bonuses.map((bonus, index) => (\n                        <li key={`${bonus}-${index}`}>{bonus}</li>\n                      ))}\n                    </ul>\n                  ) : (\n                    <p>Brak zapisanych dodatkowych linii.</p>\n                  )}\n                </div>\n""",
              """                <div className={styles.bonusBlock}>\n                  <span>Bonusy</span>\n                  {selectedBonusGroups.regular.length > 0 ? (\n                    <ul>\n                      {selectedBonusGroups.regular.map((bonus, index) => (\n                        <li key={`${bonus}-${index}`}>{bonus}</li>\n                      ))}\n                    </ul>\n                  ) : selectedBonusGroups.sockets.length === 0 ? (\n                    <p>Brak zapisanych dodatkowych linii.</p>\n                  ) : null}\n\n                  {selectedBonusGroups.sockets.length > 0 ? (\n                    <div className={styles.socketBonusGroup}>\n                      <span>Kamienie / wtopy</span>\n                      <ul>\n                        {selectedBonusGroups.sockets.map((bonus, index) => (\n                          <li key={`${bonus}-socket-${index}`}>{bonus}</li>\n                        ))}\n                      </ul>\n                    </div>\n                  ) : null}\n                </div>\n""",
          )

          # EQ V2: larger detail card and explicit visual gap before stones/socket effects.
          replace(
              'apps/web/app/teams/[teamId]/characters/[characterId]/character-equipment-v2.module.css',
              """  grid-template-columns: minmax(0, 1fr) 330px;\n""",
              """  grid-template-columns: minmax(0, 1fr) minmax(380px, 410px);\n""",
          )
          replace(
              'apps/web/app/teams/[teamId]/characters/[characterId]/character-equipment-v2.module.css',
              """  min-height: 420px;\n  padding: 20px;\n}\n\n.detailsHead {\n  display: grid;\n  grid-template-columns: 72px minmax(0, 1fr);\n  gap: 14px;\n""",
              """  min-height: 470px;\n  padding: 24px;\n}\n\n.detailsHead {\n  display: grid;\n  grid-template-columns: 88px minmax(0, 1fr);\n  gap: 18px;\n""",
          )
          replace(
              'apps/web/app/teams/[teamId]/characters/[characterId]/character-equipment-v2.module.css',
              """  width: 70px;\n  height: 76px;\n""",
              """  width: 86px;\n  height: 92px;\n""",
          )
          replace(
              'apps/web/app/teams/[teamId]/characters/[characterId]/character-equipment-v2.module.css',
              """  max-width: 58px;\n  max-height: 64px;\n""",
              """  max-width: 72px;\n  max-height: 78px;\n""",
          )
          replace(
              'apps/web/app/teams/[teamId]/characters/[characterId]/character-equipment-v2.module.css',
              """  font-size: 17px;\n  line-height: 1.15;\n}\n\n.bonusBlock {\n  margin-top: 20px;\n  padding: 15px;\n""",
              """  font-size: 20px;\n  line-height: 1.2;\n}\n\n.bonusBlock {\n  margin-top: 22px;\n  padding: 18px;\n""",
          )
          replace(
              'apps/web/app/teams/[teamId]/characters/[characterId]/character-equipment-v2.module.css',
              """  color: #c6d0ca;\n  font-size: 11px;\n  line-height: 1.45;\n}\n\n.bonusBlock li::before {\n""",
              """  color: #c6d0ca;\n  font-size: 13px;\n  line-height: 1.55;\n}\n\n.socketBonusGroup {\n  margin-top: 24px;\n  padding-top: 18px;\n  border-top: 1px solid rgba(224, 183, 88, 0.2);\n}\n\n.socketBonusGroup > span {\n  color: #d8b86d;\n  font-size: 10px;\n  font-weight: 800;\n  letter-spacing: 0.1em;\n  text-transform: uppercase;\n}\n\n.socketBonusGroup ul {\n  margin-top: 12px;\n}\n\n.bonusBlock li::before {\n""",
          )

          # Timer API: allow choosing 8h/12h at the moment a Soul Stone cycle is started.
          replace(
              'apps/web/src/player-store.ts',
              """  /** Custom cycle length in minutes (manual timers). Presets use kind rules instead. */\n  readonly durationMinutes?: number;\n""",
              """  /** Cycle length in minutes when the timer supports a per-cycle override (e.g. Soul Stone 8h/12h). */\n  readonly durationMinutes?: number;\n""",
          )
          replace(
              'apps/web/src/player-store.ts',
              """export function markTimerDone(\n  state: PlayerStoreState,\n  workspaceId: string,\n  timerId: string,\n  operationId: string,\n): PlayerStoreState {\n""",
              """export function markTimerDone(\n  state: PlayerStoreState,\n  workspaceId: string,\n  timerId: string,\n  operationId: string,\n  durationMinutes?: number,\n): PlayerStoreState {\n""",
          )
          replace(
              'apps/web/src/player-store.ts',
              """    const kind = existing.kind ?? inferProgressionKind(existing.label);\n    const restart = restartAfterDone(kind, new Date(), existing.durationMinutes);\n    const timers = workspace.timers.map((timer) => {\n""",
              """    const kind = existing.kind ?? inferProgressionKind(existing.label);\n    const effectiveDurationMinutes =\n      kind === 'soul_stone' && (durationMinutes === 8 * 60 || durationMinutes === 12 * 60)\n        ? durationMinutes\n        : existing.durationMinutes;\n    const restart = restartAfterDone(kind, new Date(), effectiveDurationMinutes);\n    const timers = workspace.timers.map((timer) => {\n""",
          )
          replace(
              'apps/web/src/player-store.ts',
              """        ...(kind ? { kind } : {}),\n        status: 'running' as const,\n""",
              """        ...(kind ? { kind } : {}),\n        ...(kind === 'soul_stone' && effectiveDurationMinutes\n          ? { durationMinutes: effectiveDurationMinutes }\n          : {}),\n        status: 'running' as const,\n""",
          )

          replace(
              'apps/web/src/player-store-react.tsx',
              """  completeTimer: (workspaceId: string, timerId: string, operationId: string) => void;\n""",
              """  completeTimer: (\n    workspaceId: string,\n    timerId: string,\n    operationId: string,\n    durationMinutes?: number,\n  ) => void;\n""",
          )
          replace(
              'apps/web/src/player-store-react.tsx',
              """      completeTimer: (workspaceId, timerId, operationId) => {\n        apply((current) => markTimerDone(current, workspaceId, timerId, operationId));\n      },\n""",
              """      completeTimer: (workspaceId, timerId, operationId, durationMinutes) => {\n        apply((current) =>\n          markTimerDone(current, workspaceId, timerId, operationId, durationMinutes),\n        );\n      },\n""",
          )

          replace(
              'apps/web/app/teams/[teamId]/characters/[characterId]/character-equipment.tsx',
              """  readonly onCompleteTimer: (timerId: string, label: string, characterName: string) => void;\n""",
              """  readonly onCompleteTimer: (\n    timerId: string,\n    label: string,\n    characterName: string,\n    durationMinutes?: number,\n  ) => void;\n""",
          )
          replace(
              'apps/web/app/teams/[teamId]/characters/[characterId]/character-equipment.tsx',
              """                    <button\n                      disabled={!writesEnabled || blocked}\n                      onClick={() => {\n                        if (blocked) return;\n                        onCompleteTimer(timer.id, timer.label, entry.name);\n                      }}\n                      title={\n                        lockedDue\n                          ? 'Timer zakończony — odświeżenie uruchomi kolejny cykl'\n                          : blocked\n                            ? 'Timer w toku — edycja zablokowana'\n                            : 'Jeden klik uruchamia cykl'\n                      }\n                      type=\"button\"\n                    >\n                      {lockedDue ? 'Odśwież' : blocked ? 'Zablokowany' : 'Start'}\n                    </button>\n""",
              """                    {timerKind(timer) === 'soul_stone' && !blocked ? (\n                      <>\n                        <button\n                          disabled={!writesEnabled}\n                          onClick={() =>\n                            onCompleteTimer(timer.id, timer.label, entry.name, 8 * 60)\n                          }\n                          title=\"Uruchom cooldown Kamienia Duchowego na 8 godzin\"\n                          type=\"button\"\n                        >\n                          {lockedDue ? 'Odśwież 8h' : 'Start 8h'}\n                        </button>\n                        <button\n                          disabled={!writesEnabled}\n                          onClick={() =>\n                            onCompleteTimer(timer.id, timer.label, entry.name, 12 * 60)\n                          }\n                          title=\"Uruchom cooldown Kamienia Duchowego na 12 godzin\"\n                          type=\"button\"\n                        >\n                          {lockedDue ? 'Odśwież 12h' : 'Start 12h'}\n                        </button>\n                      </>\n                    ) : (\n                      <button\n                        disabled={!writesEnabled || blocked}\n                        onClick={() => {\n                          if (blocked) return;\n                          onCompleteTimer(timer.id, timer.label, entry.name);\n                        }}\n                        title={\n                          lockedDue\n                            ? 'Timer zakończony — odświeżenie uruchomi kolejny cykl'\n                            : blocked\n                              ? 'Timer w toku — edycja zablokowana'\n                              : 'Jeden klik uruchamia cykl'\n                        }\n                        type=\"button\"\n                      >\n                        {lockedDue ? 'Odśwież' : blocked ? 'Zablokowany' : 'Start'}\n                      </button>\n                    )}\n""",
          )
          replace(
              'apps/web/app/teams/[teamId]/characters/[characterId]/character-equipment.tsx',
              """      onCompleteTimer={(timerId, label, characterName) => {\n        const operationId = `timer-${timerId}-${Date.now()}`;\n        completeTimer(workspace.id, timerId, operationId);\n""",
              """      onCompleteTimer={(timerId, label, characterName, durationMinutes) => {\n        const operationId = `timer-${timerId}-${Date.now()}`;\n        completeTimer(workspace.id, timerId, operationId, durationMinutes);\n""",
          )

          # Generały/Metiny: live history means last 60 minutes, while persisted state remains intact.
          replace(
              'apps/web/app/generaly-metki/page.tsx',
              """const REQUEST_ICONS: Readonly<Record<MetinGeneralHuntRequestType, string>> = {\n  pvp: '⚔️',\n  dps: '💥',\n  buff: '✨',\n};\n\nfunction newId(prefix: string): string {\n""",
              """const REQUEST_ICONS: Readonly<Record<MetinGeneralHuntRequestType, string>> = {\n  pvp: '⚔️',\n  dps: '💥',\n  buff: '✨',\n};\n\nconst LIVE_HISTORY_MS = 60 * 60 * 1_000;\n\nfunction newId(prefix: string): string {\n""",
          )
          replace(
              'apps/web/app/generaly-metki/page.tsx',
              """  const state = useMemo(\n    () => normalizeState(huntDefinition.key, snapshot?.state, now),\n    [huntDefinition.key, now, snapshot?.state],\n  );\n\n  const loadHunt = useCallback(\n""",
              """  const state = useMemo(\n    () => normalizeState(huntDefinition.key, snapshot?.state, now),\n    [huntDefinition.key, now, snapshot?.state],\n  );\n  const liveHistory = useMemo(\n    () => state.history.filter((entry) => now - entry.createdAt <= LIVE_HISTORY_MS),\n    [now, state.history],\n  );\n\n  const loadHunt = useCallback(\n""",
          )
          replace(
              'apps/web/app/generaly-metki/page.tsx',
              """              <em>{state.history.length}</em>\n            </div>\n\n            <div className={styles.historyList}>\n              {state.history.length === 0 ? (\n                <p className={styles.empty}>Jeszcze bez komend w tym wątku.</p>\n              ) : null}\n\n              {state.history.map((entry) => {\n""",
              """              <em>{liveHistory.length}</em>\n            </div>\n\n            <div className={styles.historyList}>\n              {liveHistory.length === 0 ? (\n                <p className={styles.empty}>Brak komend z ostatnich 60 minut.</p>\n              ) : null}\n\n              {liveHistory.map((entry) => {\n""",
          )

          # Generały/Metiny: 14-inch laptop layout — larger left live-history panel and readable rows.
          replace(
              'apps/web/app/generaly-metki/generaly-metki.module.css',
              """  grid-template-columns: minmax(230px, 280px) minmax(0, 1fr) 326px;\n""",
              """  grid-template-columns: minmax(280px, 340px) minmax(520px, 1fr) minmax(290px, 320px);\n""",
          )
          replace(
              'apps/web/app/generaly-metki/generaly-metki.module.css',
              """  width: min(100%, 58vh, 600px);\n""",
              """  width: min(100%, 620px);\n""",
          )
          replace(
              'apps/web/app/generaly-metki/generaly-metki.module.css',
              """  padding: 12px;\n  background:\n""",
              """  padding: 14px;\n  background:\n""",
          )
          replace(
              'apps/web/app/generaly-metki/generaly-metki.module.css',
              """  min-height: 50px;\n  padding: 7px 8px;\n""",
              """  min-height: 58px;\n  padding: 9px 10px;\n""",
          )
          replace(
              'apps/web/app/generaly-metki/generaly-metki.module.css',
              """  border-radius: 9px;\n  font-size: 9px;\n""",
              """  border-radius: 9px;\n  font-size: 10px;\n""",
          )
          replace(
              'apps/web/app/generaly-metki/generaly-metki.module.css',
              """  color: var(--muted, #9299a9);\n  font-size: 8px;\n}\n\n.historyChannel {\n""",
              """  color: var(--muted, #9299a9);\n  font-size: 9px;\n}\n\n.historyChannel {\n""",
          )
          replace(
              'apps/web/app/generaly-metki/generaly-metki.module.css',
              """  color: var(--muted-strong, #b8bfcd);\n  font-size: 9px;\n  text-overflow: ellipsis;\n""",
              """  color: var(--muted-strong, #b8bfcd);\n  font-size: 10px;\n  text-overflow: ellipsis;\n""",
          )
          replace(
              'apps/web/app/generaly-metki/generaly-metki.module.css',
              """  overflow: hidden;\n  font-size: 9px;\n  font-weight: 850;\n""",
              """  overflow: hidden;\n  font-size: 10px;\n  font-weight: 850;\n""",
          )
          replace(
              'apps/web/app/generaly-metki/generaly-metki.module.css',
              """@media (max-width: 1260px) {\n  .workspace {\n    grid-template-columns: minmax(210px, 240px) minmax(0, 1fr) 300px;\n  }\n""",
              """@media (max-width: 1260px) {\n  .workspace {\n    grid-template-columns: minmax(260px, 280px) minmax(0, 1fr) minmax(260px, 280px);\n  }\n""",
          )

          PY

          git diff --check
          git rm .github/workflows/apply-feedback-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web
          git commit -m 'fix(web): apply EQ hunt and timer feedback'
          git push origin HEAD:fix/feedback-eq-hunts-timers-20260908
