name: Temporary Discord Timer DM Fix

on:
  push:
    branches:
      - 'fix/discord-timer-dm-actions-20260908'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: fix/discord-timer-dm-actions-20260908
          fetch-depth: 0

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply patch
        run: node tools/scripts/apply-discord-timer-dm-actions-fix.mjs

      - name: Format changed gateway file
        run: pnpm exec prettier --write apps/discord-gateway/src/interface/discord/team-sync-interaction-router.ts

      - name: Typecheck repository
        run: pnpm typecheck

      - name: Test Discord timer interactions
        run: >-
          pnpm exec vitest run --config apps/discord-gateway/vitest.config.ts
          apps/discord-gateway/src/application/notify/notify-payload.spec.ts
          apps/discord-gateway/src/infrastructure/security/character-timer-custom-id.spec.ts
          apps/discord-gateway/src/presentation/discord/team-coordination-renderers.spec.ts
          apps/discord-gateway/src/interface/discord/interaction-router.spec.ts

      - name: Build repository
        run: pnpm build

      - name: Commit patch result
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch changes to commit.'
            exit 0
          fi
          git config user.name 'HOMZIKx'
          git config user.email 'ciborex12@gmail.com'
          git add apps/discord-gateway/src/interface/discord/team-sync-interaction-router.ts
          git commit -m 'fix(discord): repair timer DM actions against shared workspace'
          git push origin HEAD:fix/discord-timer-dm-actions-20260908
