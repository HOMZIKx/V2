name: Apply economy runtime hardening patch

on:
  push:
    branches: [fix/e2e-service-wiring-20260908]
    paths: [.github/workflows/apply-economy-runtime-fixes.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/e2e-service-wiring-20260908
      - name: Apply audited fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected snippet not found in {path}')
              p.write_text(text.replace(old, new, 1))

          # Global market price hints: one shared price history across workspaces.
          replace(
              'services/player-team-service/src/infrastructure/db/team-economy.repository.ts',
              """  public async searchItems(\n    workspaceId: string,\n    query: string,\n  ): Promise<readonly EconomyCatalogItem[]> {\n    const needle = query.trim();\n    const result = await this.db.query(\n      `SELECT DISTINCT ON (i.id)\n         i.id, i.canonical_name, i.category, i.image_url,\n         lp.unit_price AS last_unit_price, lp.currency AS last_currency, lp.created_at AS last_price_at\n       FROM player_team_economy_items i\n       LEFT JOIN player_team_economy_item_aliases a ON a.item_id = i.id\n       LEFT JOIN LATERAL (\n         SELECT p.unit_price, p.currency, p.created_at\n         FROM player_team_economy_prices p\n         WHERE p.item_id = i.id AND p.workspace_id = $1\n         ORDER BY p.created_at DESC LIMIT 1\n       ) lp ON TRUE\n       WHERE $2 = '' OR i.canonical_name ILIKE '%' || $2 || '%' OR a.alias ILIKE '%' || $2 || '%'\n       ORDER BY i.id, i.canonical_name\n       LIMIT 40`,\n      [workspaceId, needle],\n    );\n    return result.rows.map((row) => this.mapCatalogRow(row));\n  }\n""",
              """  public async searchItems(\n    workspaceId: string,\n    query: string,\n  ): Promise<readonly EconomyCatalogItem[]> {\n    void workspaceId;\n    const needle = query.trim();\n    const result = await this.db.query(\n      `SELECT DISTINCT ON (i.id)\n         i.id, i.canonical_name, i.category, i.image_url,\n         lp.unit_price AS last_unit_price, lp.currency AS last_currency, lp.created_at AS last_price_at\n       FROM player_team_economy_items i\n       LEFT JOIN player_team_economy_item_aliases a ON a.item_id = i.id\n       LEFT JOIN LATERAL (\n         SELECT p.unit_price, p.currency, p.created_at\n         FROM player_team_economy_prices p\n         WHERE p.item_id = i.id\n         ORDER BY p.created_at DESC LIMIT 1\n       ) lp ON TRUE\n       WHERE $1 = '' OR i.canonical_name ILIKE '%' || $1 || '%' OR a.alias ILIKE '%' || $1 || '%'\n       ORDER BY i.id, i.canonical_name\n       LIMIT 40`,\n      [needle],\n    );\n    return result.rows.map((row) => this.mapCatalogRow(row));\n  }\n""",
          )
          replace(
              'services/player-team-service/src/infrastructure/db/team-economy.repository.ts',
              """  private async catalogItemById(\n    client: Pool | PoolClient,\n    itemId: string,\n    workspaceId = '',\n  ): Promise<EconomyCatalogItem> {\n    const result = await client.query(\n      `SELECT i.id, i.canonical_name, i.category, i.image_url,\n         lp.unit_price AS last_unit_price, lp.currency AS last_currency, lp.created_at AS last_price_at\n       FROM player_team_economy_items i\n       LEFT JOIN LATERAL (\n         SELECT p.unit_price, p.currency, p.created_at\n         FROM player_team_economy_prices p\n         WHERE p.item_id = i.id AND ($2 = '' OR p.workspace_id = $2)\n         ORDER BY p.created_at DESC LIMIT 1\n       ) lp ON TRUE\n       WHERE i.id = $1`,\n      [itemId, workspaceId],\n    );\n""",
              """  private async catalogItemById(\n    client: Pool | PoolClient,\n    itemId: string,\n  ): Promise<EconomyCatalogItem> {\n    const result = await client.query(\n      `SELECT i.id, i.canonical_name, i.category, i.image_url,\n         lp.unit_price AS last_unit_price, lp.currency AS last_currency, lp.created_at AS last_price_at\n       FROM player_team_economy_items i\n       LEFT JOIN LATERAL (\n         SELECT p.unit_price, p.currency, p.created_at\n         FROM player_team_economy_prices p\n         WHERE p.item_id = i.id\n         ORDER BY p.created_at DESC LIMIT 1\n       ) lp ON TRUE\n       WHERE i.id = $1`,\n      [itemId],\n    );\n""",
          )

          # Gemini uses the Zeabur variable that is actually configured; unique dynamic
          # search hits are valid alias matches even if the canonical title differs.
          replace(
              'apps/web/app/api/team-economy/recognize/route.ts',
              "const model = process.env.GEMINI_MODEL?.trim() || 'gemini-3-flash-preview';",
              "const model =\n    process.env.GEMINI_VISION_MODEL?.trim() ||\n    process.env.GEMINI_MODEL?.trim() ||\n    'gemini-3-flash-preview';",
          )
          replace(
              'apps/web/app/api/team-economy/recognize/route.ts',
              "const match = candidates.length === 1 ? candidates[0] : null;",
              "const match =\n    candidates.length === 1\n      ? candidates[0]\n      : candidates.length === 0 && rows.length === 1\n        ? rows[0]\n        : null;",
          )

          # Preserve the existing drop-item identity during edit so warehouse status can
          # survive changes and market prices are only observed when the price actually changes.
          replace(
              'services/player-team-service/src/interface/team-economy-management.controller.ts',
              """const dropItemSchema = z\n  .object({\n    itemId: z.string().min(1).nullable(),\n""",
              """const dropItemSchema = z\n  .object({\n    dropItemId: z.string().min(1).nullable().optional(),\n    itemId: z.string().min(1).nullable(),\n""",
          )
          replace(
              'apps/web/app/teams/[teamId]/economy/drop-history-actions.tsx',
              """          items: resolved.map((item) => ({\n            itemId: item.itemId,\n""",
              """          items: resolved.map((item) => ({\n            dropItemId: item.id || null,\n            itemId: item.itemId,\n""",
          )

          # Main drop form should initialize members once per workspace, not re-select
          # everybody after the user intentionally unchecks all participants.
          replace(
              'apps/web/app/teams/[teamId]/economy/team-economy.tsx',
              "  useCallback,\n  useEffect,\n  useMemo,\n  useState,",
              "  useCallback,\n  useEffect,\n  useMemo,\n  useRef,\n  useState,",
          )
          replace(
              'apps/web/app/teams/[teamId]/economy/team-economy.tsx',
              """  const [selectedMembers, setSelectedMembers] = useState<string[]>([]);\n\n  const [expenseLabel, setExpenseLabel] = useState('');\n""",
              """  const [selectedMembers, setSelectedMembers] = useState<string[]>([]);\n  const initializedMembersForWorkspaceRef = useRef<string | null>(null);\n\n  const [expenseLabel, setExpenseLabel] = useState('');\n""",
          )
          replace(
              'apps/web/app/teams/[teamId]/economy/team-economy.tsx',
              """  useEffect(() => {\n    if (workspace && selectedMembers.length === 0) {\n      setSelectedMembers(workspace.members.map((member) => member.id));\n    }\n  }, [workspace, selectedMembers.length]);\n""",
              """  useEffect(() => {\n    if (!workspace) {\n      initializedMembersForWorkspaceRef.current = null;\n      return;\n    }\n    if (initializedMembersForWorkspaceRef.current === workspace.id) return;\n    initializedMembersForWorkspaceRef.current = workspace.id;\n    setSelectedMembers(workspace.members.map((member) => member.id));\n  }, [workspace]);\n""",
          )
          PY

          git config user.name 'HOMZIKx'
          git config user.email 'ciborex12@gmail.com'
          git add services/player-team-service/src/infrastructure/db/team-economy.repository.ts \
                  services/player-team-service/src/interface/team-economy-management.controller.ts \
                  apps/web/app/api/team-economy/recognize/route.ts \
                  'apps/web/app/teams/[teamId]/economy/drop-history-actions.tsx' \
                  'apps/web/app/teams/[teamId]/economy/team-economy.tsx'
          git commit -m 'fix(economy): align prices editing AI and participants'
          git push origin HEAD:fix/e2e-service-wiring-20260908
