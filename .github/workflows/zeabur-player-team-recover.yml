name: Zeabur player-team recovery probe

on:
  push:
    branches:
      - fix/e2e-service-wiring-20260908
    paths:
      - .github/workflows/zeabur-player-team-recover.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-and-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Restart player-team-service and verify live wiring
        env:
          ZEABUR_API_TOKEN: ${{ secrets.zebur }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys, time

          endpoint = 'https://api.zeabur.com/graphql'
          token = os.environ.get('ZEABUR_API_TOKEN', '').strip()
          if not token:
              print('::error::Missing Zeabur API token')
              sys.exit(1)

          def gql(query, variables=None, fatal=True):
              payload = json.dumps({'query': query, 'variables': variables or {}})
              result = subprocess.run([
                  'curl','--silent','--show-error','--fail-with-body','--request','POST','--url',endpoint,
                  '--header',f'Authorization: Bearer {token}','--header','Content-Type: application/json',
                  '--data-binary',payload,
              ], capture_output=True, text=True, timeout=40)
              if result.returncode != 0:
                  if fatal:
                      print('::error::Zeabur transport failed')
                      sys.exit(1)
                  return None, 'transport'
              try:
                  body = json.loads(result.stdout)
              except json.JSONDecodeError:
                  if fatal:
                      print('::error::Zeabur returned invalid JSON')
                      sys.exit(1)
                  return None, 'invalid-json'
              if body.get('errors'):
                  msg = ' | '.join(str(x.get('message','unknown'))[:180] for x in body['errors'][:3])
                  if fatal:
                      print('::error::Zeabur GraphQL: ' + msg)
                      sys.exit(1)
                  return None, msg
              return body.get('data') or {}, None

          root, _ = gql('query { projects { edges { node { _id name } } } }')
          projects = [e.get('node') or {} for e in ((root.get('projects') or {}).get('edges') or [])]
          project = next((p for p in projects if p.get('name') == 'untitled-1'), None) or (projects[0] if len(projects) == 1 else None)
          if not project:
              print('::error::Destiled project not resolved')
              sys.exit(1)

          detail, _ = gql('''query($id:ObjectID!){ project(_id:$id){ environments{_id name} services{_id name} } }''', {'id':project['_id']})
          project_detail = detail.get('project') or {}
          env = next((x for x in project_detail.get('environments') or [] if x.get('name') == 'production'), None)
          service_map = {x.get('name'):x.get('_id') for x in project_detail.get('services') or []}
          if not env or not service_map.get('player-team-service') or not service_map.get('webapp-dest'):
              print('::error::Production/player-team-service/webapp-dest missing')
              sys.exit(1)
          env_id = env['_id']
          player_id = service_map['player-team-service']
          web_id = service_map['webapp-dest']

          restart, err = gql('''mutation($serviceID:ObjectID!,$environmentID:ObjectID!){ restartService(serviceID:$serviceID, environmentID:$environmentID) }''', {
              'serviceID': player_id,
              'environmentID': env_id,
          }, fatal=False)
          if restart is None:
              print('::error::restartService failed: ' + str(err)[:200])
              sys.exit(1)
          print('player_team_restart=requested')

          exec_mut = '''mutation($serviceID:ObjectID!,$environmentID:ObjectID!,$command:[String!]!){ executeCommand(serviceID:$serviceID, environmentID:$environmentID, command:$command){ exitCode output } }'''
          def execute(service_id, script):
              data, error = gql(exec_mut, {'serviceID':service_id,'environmentID':env_id,'command':['node','-e',script]}, fatal=False)
              if data is None:
                  return None, error
              return data.get('executeCommand') or {}, None

          for attempt in range(1, 19):
              time.sleep(5)
              result, error = execute(player_id, "console.log('active')")
              if result is not None and result.get('exitCode') == 0:
                  print(f'player_team_runtime=active attempt={attempt}')
                  break
              print(f'player_team_runtime=waiting attempt={attempt}')
          else:
              print('::error::player-team-service remained inactive after restart')
              sys.exit(1)

          player_script = r'''
          const fs = require('fs');
          const required = ['PLAYER_TEAM_DATABASE_URL','PLAYER_TEAM_INTERNAL_JWT_ENABLED','PLAYER_TEAM_INTERNAL_JWT_ISSUER','PLAYER_TEAM_INTERNAL_JWT_JWKS_URL'];
          const missing = required.filter(k => !(process.env[k] || '').trim());
          console.log(`player_env=${missing.length === 0 && process.env.PLAYER_TEAM_INTERNAL_JWT_ENABLED === 'true' ? 'ok' : 'fail'}`);
          if (missing.length) console.log(`player_missing=${missing.join(',')}`);
          const sourceOk = [
            '/app/services/player-team-service/src/interface/team-economy.controller.ts',
            '/app/services/player-team-service/src/interface/team-economy-management.controller.ts',
            '/app/services/player-team-service/migrations/006_team_economy.sql'
          ].every(p => fs.existsSync(p));
          console.log(`player_economy_source=${sourceOk ? 'ok':'fail'}`);
          async function main(){
            let failed = missing.length > 0 || process.env.PLAYER_TEAM_INTERNAL_JWT_ENABLED !== 'true' || !sourceOk;
            try {
              const r = await fetch(`http://127.0.0.1:${process.env.PORT || 4400}/health/ready`, {signal:AbortSignal.timeout(5000)});
              console.log(`player_ready=${r.status === 200 ? 'ok':'fail'} status=${r.status}`);
              if(r.status !== 200) failed = true;
            } catch(e){ console.log(`player_ready=fail code=${e?.cause?.code || e?.name || 'unknown'}`); failed = true; }
            if(process.env.PLAYER_TEAM_DATABASE_URL){
              const {Pool}=require('pg'); const pool=new Pool({connectionString:process.env.PLAYER_TEAM_DATABASE_URL,max:1,connectionTimeoutMillis:5000});
              try{
                const m=await pool.query("SELECT EXISTS(SELECT 1 FROM player_team_schema_migrations WHERE id='006_team_economy.sql') AS ok");
                const t=await pool.query("SELECT to_regclass('public.player_team_economy_items') IS NOT NULL AND to_regclass('public.player_team_drop_sessions') IS NOT NULL AND to_regclass('public.player_team_drop_money') IS NOT NULL AND to_regclass('public.player_team_expenses') IS NOT NULL AS ok");
                console.log(`migration_006=${m.rows[0]?.ok === true ? 'ok':'fail'}`);
                console.log(`economy_tables=${t.rows[0]?.ok === true ? 'ok':'fail'}`);
                if(m.rows[0]?.ok !== true || t.rows[0]?.ok !== true) failed = true;
              }catch(e){console.log(`db_probe=fail code=${e?.code || e?.name || 'unknown'}`);failed=true}finally{await pool.end().catch(()=>{})}
            }
            if(failed) process.exitCode=2;
          }
          main().catch(()=>{process.exitCode=3});
          '''
          player, error = execute(player_id, player_script)
          if player is None:
              print('::error::player internal probe command failed: ' + str(error)[:180])
              sys.exit(1)
          print('--- player-team-service ---')
          print(str(player.get('output') or '').strip())
          if player.get('exitCode') != 0:
              print('::error::player internal probe failed')
              sys.exit(1)

          web_script = r'''
          const dns=require('dns').promises;
          async function main(){
            const base=(process.env.PLAYER_TEAM_PROXY_TARGET || '').trim().replace(/\/+$/,'');
            let failed=!base;
            if(!base){console.log('web_player_target=missing');process.exitCode=2;return}
            const u=new URL(base);
            try{await dns.lookup(u.hostname);console.log('web_player_dns=ok')}catch(e){console.log(`web_player_dns=fail code=${e?.code || 'unknown'}`);failed=true}
            for(const [path,expected,label] of [
              ['/health/live',[200],'live'],
              ['/health/ready',[200],'ready'],
              ['/player-team/v1/economy/workspaces/__probe__/items?q=x',[401,403],'economy_guard'],
              ['/player-team/v1/metin-general-hunts',[401,403],'hunts_guard']
            ]){
              try{const r=await fetch(base+path,{redirect:'manual',signal:AbortSignal.timeout(5000)});const ok=expected.includes(r.status);console.log(`web_to_player_${label}=${ok?'ok':'fail'} status=${r.status}`);if(!ok)failed=true}catch(e){console.log(`web_to_player_${label}=fail code=${e?.cause?.code || e?.name || 'unknown'}`);failed=true}
            }
            if(failed)process.exitCode=2;
          }
          main().catch(()=>{process.exitCode=3});
          '''
          web, error = execute(web_id, web_script)
          if web is None:
              print('::error::web internal probe command failed: ' + str(error)[:180])
              sys.exit(1)
          print('--- webapp-dest ---')
          print(str(web.get('output') or '').strip())
          if web.get('exitCode') != 0:
              print('::error::web-to-player probe failed')
              sys.exit(1)

          print('PLAYER_TEAM_RUNTIME_WIRING=OK')
          PY
