name: Zeabur player-team source probe
on:
  push:
    branches: [fix/e2e-service-wiring-20260908]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect player-team deployment metadata
        env:
          ZEABUR_API_TOKEN: ${{ secrets.zebur }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          token=os.environ.get('ZEABUR_API_TOKEN','').strip(); endpoint='https://api.zeabur.com/graphql'
          if not token: print('::error::Missing Zeabur API token'); sys.exit(1)
          def gql(q,v=None):
            r=subprocess.run(['curl','-sS','--fail-with-body','-X','POST',endpoint,'-H',f'Authorization: Bearer {token}','-H','Content-Type: application/json','--data-binary',json.dumps({'query':q,'variables':v or {}})],capture_output=True,text=True,timeout=40)
            if r.returncode: print('::error::Zeabur transport failed'); sys.exit(1)
            b=json.loads(r.stdout)
            if b.get('errors'): print('::error::Zeabur GraphQL: '+str(b['errors'][0].get('message','unknown'))[:180]); sys.exit(1)
            return b.get('data') or {}
          root=gql('query{projects{edges{node{_id name}}}}'); ps=[e['node'] for e in root['projects']['edges']]
          p=next((x for x in ps if x['name']=='untitled-1'),None) or (ps[0] if len(ps)==1 else None)
          if not p: print('::error::Project not resolved');sys.exit(1)
          d=gql('query($id:ObjectID!){project(_id:$id){environments{_id name} services{_id name rootDirectory customBuildCommand customStartCommand watchPaths template}}}',{'id':p['_id']})['project']
          env=next(x for x in d['environments'] if x['name']=='production')
          service=next((x for x in d['services'] if x['name']=='player-team-service'),None)
          if not service: print('::error::player-team-service missing');sys.exit(1)
          q='query($serviceID:ObjectID!,$environmentID:ObjectID!){service(_id:$serviceID){_id name rootDirectory customBuildCommand customStartCommand watchPaths template gitTrigger(environmentID:$environmentID){branchName provider repoID} status(environmentID:$environmentID)}}'
          detail=gql(q,{'serviceID':service['_id'],'environmentID':env['_id']})['service']
          gt=detail.get('gitTrigger') or {}
          print('status='+str(detail.get('status')))
          print('template='+str(detail.get('template')))
          print('branch='+str(gt.get('branchName')))
          print('provider='+str(gt.get('provider')))
          print('rootDirectory='+str(detail.get('rootDirectory')))
          print('customBuildCommand='+str(detail.get('customBuildCommand')))
          print('customStartCommand='+str(detail.get('customStartCommand')))
          print('watchPaths='+json.dumps(detail.get('watchPaths') or []))
          PY