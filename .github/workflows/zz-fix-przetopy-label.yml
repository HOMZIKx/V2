name: Apply przetopy terminology fix

on:
  push:
    branches:
      - fix/feedback-eq-hunts-timers-20260908
    paths:
      - .github/workflows/zz-fix-przetopy-label.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/feedback-eq-hunts-timers-20260908
      - name: Replace visible label and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/app/teams/[teamId]/characters/[characterId]/character-equipment-v2.tsx')
          text = path.read_text(encoding='utf-8')
          old = 'Kamienie / wtopy'
          new = 'Kamienie / przetopy'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one visible label, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/zz-fix-przetopy-label.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(web): use przetopy terminology'
          git push origin HEAD:fix/feedback-eq-hunts-timers-20260908
