name: Zeabur operations bridge

on:
  push:
    branches:
      - ops/zeabur-control
    paths:
      - ops/zeabur/command.json
      - ops/zeabur/run.mjs
      - ops/zeabur/audit-env.mjs
      - ops/zeabur/repair-production.mjs
      - .github/workflows/zeabur-ops.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zeabur-operations
  cancel-in-progress: false

jobs:
  zeabur-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ZEABUR_API_TOKEN: ${{ secrets.zebur }}
      ZEABUR_COMMAND_PATH: ops/zeabur/command.json
      ZEABUR_OUTPUT_DIR: ops/zeabur/out

    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4

      - name: Execute guarded Zeabur operation
        shell: bash
        run: |
          MODE="$(node -e "const c=require('./ops/zeabur/command.json'); process.stdout.write(c.mode || 'auth')")"
          case "$MODE" in
            env_audit) node ops/zeabur/audit-env.mjs ;;
            production_repair) node ops/zeabur/repair-production.mjs ;;
            *) node ops/zeabur/run.mjs ;;
          esac

      - name: Publish operation summary
        if: always()
        shell: bash
        run: |
          if [ -f ops/zeabur/out/summary.md ]; then
            cat ops/zeabur/out/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeabur-result-${{ github.run_id }}
          path: ops/zeabur/out/
          if-no-files-found: warn
          retention-days: 7
