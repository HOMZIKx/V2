name: Zeabur player-team redeploy probe

on:
  push:
    branches:
      - fix/e2e-service-wiring-20260908
    paths:
      - .github/workflows/zeabur-player-team-redeploy.yml

permissions:
  contents: read

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy player-team-service and wait for current routes
        env:
          ZEABUR_API_TOKEN: ${{ secrets.zebur }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys, time
          token=os.environ['ZEABUR_API_TOKEN'].strip(); endpoint='https://api.zeabur.com/graphql'
          def gql(q,v=None,fatal=True):
            r=subprocess.run(['curl','-sS','--fail-with-body','-X','POST',endpoint,'-H',f'Authorization: Bearer {token}','-H','Content-Type: application/json','--data-binary',json.dumps({'query':q,'variables':v or {}})],capture_output=True,text=True,timeout=40)
            if r.returncode:
              if fatal: print('::error::Zeabur transport failed');sys.exit(1)
              return None
            b=json.loads(r.stdout)
            if b.get('errors'):
              if fatal: print('::error::Zeabur GraphQL: '+str(b['errors'][0].get('message','unknown'))[:180]);sys.exit(1)
              return None
            return b.get('data') or {}
          root=gql('query{projects{edges{node{_id name}}}}'); ps=[e['node'] for e in root['projects']['edges']]
          p=next((x for x in ps if x['name']=='untitled-1'),None) or (ps[0] if len(ps)==1 else None)
          if not p: print('::error::Project not resolved');sys.exit(1)
          d=gql('query($id:ObjectID!){project(_id:$id){environments{_id name} services{_id name}}}',{'id':p['_id']})['project']
          env=next(x for x in d['environments'] if x['name']=='production'); sm={x['name']:x['_id'] for x in d['services']}
          player=sm.get('player-team-service'); web=sm.get('webapp-dest')
          if not player or not web: print('::error::Required services missing');sys.exit(1)
          rd=gql('mutation($serviceID:ObjectID!,$environmentID:ObjectID!){redeployService(serviceID:$serviceID,environmentID:$environmentID)}',{'serviceID':player,'environmentID':env['_id']})
          print('player_team_redeploy=requested')
          execq='mutation($serviceID:ObjectID!,$environmentID:ObjectID!,$command:[String!]!){executeCommand(serviceID:$serviceID,environmentID:$environmentID,command:$command){exitCode output}}'
          script=r'''
          async function main(){
            const base=(process.env.PLAYER_TEAM_PROXY_TARGET||'').trim().replace(/\/+$/,''); let bad=false;
            for(const [path,expect,label] of [
              ['/health/ready',[200],'ready'],
              ['/player-team/v1/economy/workspaces/__probe__/items?q=x',[401,403],'economy_items'],
              ['/player-team/v1/economy/workspaces/__probe__/management/prices',[401,403],'economy_management'],
              ['/player-team/v1/metin-general-hunts/metin-v1',[401,403],'metin_general_hunts']
            ]){
              try{const r=await fetch(base+path,{redirect:'manual',signal:AbortSignal.timeout(5000)});const ok=expect.includes(r.status);console.log(`${label}=${ok?'ok':'fail'} status=${r.status}`);if(!ok)bad=true}catch(e){console.log(`${label}=fail code=${e?.cause?.code||e?.name||'unknown'}`);bad=true}
            }
            if(bad)process.exitCode=2;
          } main().catch(()=>process.exitCode=3);
          '''
          for attempt in range(1,25):
            time.sleep(5)
            data=gql(execq,{'serviceID':web,'environmentID':env['_id'],'command':['node','-e',script]},fatal=False)
            if data:
              out=data.get('executeCommand') or {}; text=str(out.get('output') or '').strip()
              print(f'probe_attempt={attempt}')
              if text: print(text)
              if out.get('exitCode')==0:
                print('PLAYER_TEAM_REDEPLOY_WIRING=OK');sys.exit(0)
          print('::error::player-team-service did not expose current routes after redeploy');sys.exit(1)
          PY
