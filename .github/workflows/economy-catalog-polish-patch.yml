name: Economy catalog polish patch

on:
  push:
    branches:
      - feat/economy-catalog-polish-20260909
    paths:
      - .github/workflows/economy-catalog-polish-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/economy-catalog-polish-20260909
      - name: Apply targeted patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one literal match, got {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          def sub_once(path: str, pattern: str, replacement: str) -> None:
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: expected one regex match, got {count}: {pattern[:100]}')
              p.write_text(updated)

          # Canonical seed must repair stale image URLs instead of preserving them forever.
          replace_once(
              'services/player-team-service/src/infrastructure/db/team-economy.repository.ts',
              'image_url = COALESCE(image_url, $3),',
              'image_url = COALESCE($3, image_url),',
          )

          # For missing local assets prefer an exact wiki filename before fuzzy page-image matching.
          proxy = 'apps/web/src/server/item-image-proxy.ts'
          exact_block = '''  for (const candidate of itemTitleRedirectCandidates(item)) {
    const image = await fetchRemoteImage(fetchImpl, candidate);
    if (image) return image;
  }
'''
          fuzzy_block = '''  const resolvedUrl = await resolveWikiImageUrl(item, fetchImpl);
  if (resolvedUrl) {
    const image = await fetchRemoteImage(fetchImpl, resolvedUrl);
    if (image) return image;
  }
'''
          replace_once(proxy, fuzzy_block + '\n' + exact_block, '''  // Exact filename redirects are safer than fuzzy page-image matching.
  // Wiki pages can contain several visually similar item images.
''' + exact_block + '\n' + fuzzy_block)

          # One-time production repair of every canonical image_url by item name.
          catalog = json.loads(Path('apps/web/src/data/dobry-temat-item-catalog.json').read_text())
          items = catalog['items'] if isinstance(catalog, dict) and 'items' in catalog else catalog
          wiki = json.loads(Path('apps/web/src/data/wiki-item-image-map.json').read_text())
          ph = json.loads(Path('apps/web/src/data/ph-item-icon-map.json').read_text())

          def source_image(item):
              title = str(item.get('title', '')).strip()
              item_id = str(item.get('id', '')).strip()
              if title in ph:
                  return ph[title]
              if item_id in wiki:
                  return wiki[item_id]
              raw = item.get('image_url')
              if isinstance(raw, str) and raw.startswith('/item-database/wiki/'):
                  return '/game/items/wiki/' + raw.rsplit('/', 1)[-1]
              if isinstance(raw, str) and raw.startswith('/game/items/'):
                  return raw
              return None

          rows = []
          for item in items:
              name = str(item.get('title', '')).strip()
              image = source_image(item)
              if not name or not image:
                  continue
              rows.append((name, image))

          values = ',\n'.join(
              "    ('" + name.replace("'", "''") + "', '" + image.replace("'", "''") + "')"
              for name, image in rows
          )
          migration = '''-- Repair economy catalog images from the canonical DOBRYTEMAT catalog.
-- Generated from the retained V2 item dump and its image maps.
-- Updates by canonical name so legacy item IDs and foreign-key history remain intact.

WITH canonical_images(canonical_name, image_url) AS (
  VALUES
''' + values + '''
)
UPDATE player_team_economy_items AS item
SET image_url = canonical_images.image_url,
    updated_at = NOW()
FROM canonical_images
WHERE LOWER(item.canonical_name) = LOWER(canonical_images.canonical_name)
  AND item.image_url IS DISTINCT FROM canonical_images.image_url;
'''
          Path('services/player-team-service/migrations/008_economy_catalog_image_repair.sql').write_text(migration)

          # Team AI: resolve recognition against the live DB catalog and prefill latest known price.
          team = 'apps/web/app/teams/[teamId]/economy/team-economy.tsx'
          sub_once(
              team,
              r'(type AiItem = \{.*?\n\};\n)',
              r'''\1
type CatalogSearchItem = {
  id: string;
  canonicalName: string;
  category: string;
  imageUrl: string | null;
  lastPrice: { unitPrice: number; currency: Currency; createdAtIso: string } | null;
};
''',
          )
          ai_replacement = '''      const resolvedAiItems = await Promise.all(
        body.items.map(async (item, index): Promise<DraftItem> => {
          const name = item.catalogMatch?.name ?? item.recognizedName;
          let catalogItem: CatalogSearchItem | null = null;
          const catalogResponse = await fetch(
            api(workspace.id, `items?q=${encodeURIComponent(name)}`),
            { cache: 'no-store' },
          );
          if (catalogResponse.ok) {
            const candidates = (await catalogResponse.json()) as CatalogSearchItem[];
            catalogItem =
              candidates.find(
                (candidate) =>
                  candidate.canonicalName.trim().toLocaleLowerCase('pl-PL') ===
                  name.trim().toLocaleLowerCase('pl-PL'),
              ) ?? null;
          }
          return {
            key: `ai-${Date.now()}-${index}`,
            itemId: catalogItem?.id ?? null,
            name: catalogItem?.canonicalName ?? name,
            category: catalogItem?.category ?? item.catalogMatch?.category ?? 'Pozostałe',
            totalQuantity: item.quantity,
            ourQuantity: item.quantity,
            unitPrice: catalogItem?.lastPrice?.unitPrice ?? 0,
            currency: catalogItem?.lastPrice?.currency ?? 'yang',
            confidence: item.confidence,
          };
        }),
      );
      setDraftItems(resolvedAiItems);'''
          sub_once(
              team,
              r'      setDraftItems\(\s*body\.items\.map\(\(item, index\) => \(\{.*?\}\)\),\s*\);',
              ai_replacement,
          )

          # Avoid duplicate catalog rows: exact search before create during new drop save.
          create_pattern = r'''        if \(!itemId\) \{\n          const response = await fetch\(api\(workspace\.id, 'items'\), \{.*?          itemId = saved\.id;\n        \}'''
          create_replacement = '''        if (!itemId) {
          const searchResponse = await fetch(
            api(workspace.id, `items?q=${encodeURIComponent(item.name.trim())}`),
            { cache: 'no-store' },
          );
          if (searchResponse.ok) {
            const candidates = (await searchResponse.json()) as CatalogSearchItem[];
            const exact = candidates.find(
              (candidate) =>
                candidate.canonicalName.trim().toLocaleLowerCase('pl-PL') ===
                item.name.trim().toLocaleLowerCase('pl-PL'),
            );
            if (exact) itemId = exact.id;
          }
        }
        if (!itemId) {
          const response = await fetch(api(workspace.id, 'items'), {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              canonicalName: item.name.trim(),
              category: item.category || 'Pozostałe',
            }),
          });
          if (!response.ok) throw new Error(`Nie udało się zapisać przedmiotu: ${item.name}.`);
          const saved = (await response.json()) as { id: string };
          itemId = saved.id;
        }'''
          sub_once(team, create_pattern, create_replacement)

          # Same duplicate protection when an old drop is edited.
          history = 'apps/web/app/teams/[teamId]/economy/drop-history-actions.tsx'
          history_pattern = r'''      const response = await fetch\(api\(workspaceId, 'items'\), \{.*?      resolved\.push\(\{ \.\.\.item, itemId: saved\.id \}\);'''
          history_replacement = '''      const searchResponse = await fetch(
        api(workspaceId, `items?q=${encodeURIComponent(item.displayName.trim())}`),
        { cache: 'no-store' },
      );
      if (searchResponse.ok) {
        const candidates = (await searchResponse.json()) as Array<{
          id: string;
          canonicalName: string;
        }>;
        const exact = candidates.find(
          (candidate) =>
            candidate.canonicalName.trim().toLocaleLowerCase('pl-PL') ===
            item.displayName.trim().toLocaleLowerCase('pl-PL'),
        );
        if (exact) {
          resolved.push({ ...item, itemId: exact.id });
          continue;
        }
      }
      const response = await fetch(api(workspaceId, 'items'), {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ canonicalName: item.displayName.trim(), category: 'Pozostałe' }),
      });
      if (!response.ok) throw new Error(`Nie udało się zapisać przedmiotu: ${item.displayName}.`);
      const saved = (await response.json()) as { id: string };
      resolved.push({ ...item, itemId: saved.id });'''
          sub_once(history, history_pattern, history_replacement)

          # Price hints: expose median + freshness, retaining average for context.
          hint = 'apps/web/app/teams/[teamId]/economy/market-price-hint.tsx'
          selected_block = '''  const selected = useMemo(
    () => prices.find((price) => price.currency === currency) ?? null,
    [currency, prices],
  );
'''
          stats_block = '''  const stats = useMemo(() => {
    const rows = prices.filter((price) => price.currency === currency);
    const latest = rows[0] ?? null;
    if (!latest) return null;
    const values = rows.map((price) => price.unitPrice).sort((left, right) => left - right);
    const middle = Math.floor(values.length / 2);
    const median =
      values.length % 2 === 0
        ? ((values[middle - 1] ?? 0) + (values[middle] ?? 0)) / 2
        : (values[middle] ?? 0);
    const ageDays = Math.max(
      0,
      (Date.now() - new Date(latest.createdAtIso).getTime()) / 86_400_000,
    );
    const freshness = ageDays <= 3 ? 'świeża' : ageDays <= 14 ? 'starsza' : 'nieaktualna';
    return { latest, median, freshness, recentCount: rows.length };
  }, [currency, prices]);
'''
          replace_once(hint, selected_block, stats_block)
          p = Path(hint)
          text = p.read_text().replace('if (!selected) {', 'if (!stats) {', 1)
          text = text.replace('selected.unitPrice', 'stats.latest.unitPrice')
          text = text.replace('selected.createdAtIso', 'stats.latest.createdAtIso')
          text = text.replace('selected.averagePrice', 'stats.latest.averagePrice')
          text = text.replace('selected.sampleCount', 'stats.latest.sampleCount')
          average_marker = '''      <div className={styles.row}>
        <span>Średnia:</span>'''
          median_row = '''      <div className={styles.row}>
        <span>Mediana:</span>
        <strong>{compact(stats.median, currency)}</strong>
        <span>· {stats.recentCount} ostatnich wpisów · {stats.freshness}</span>
        <button className={styles.action} onClick={() => onUsePrice(stats.median)} type="button">
          Użyj mediany
        </button>
      </div>
'''
          if text.count(average_marker) != 1:
              raise SystemExit('market price hint: average marker mismatch')
          text = text.replace(average_marker, median_row + average_marker, 1)
          p.write_text(text)

          # Shared V2 palette for economy: black panels + blue/red/silver accents.
          econ = Path('apps/web/app/economy/economy.module.css')
          css = econ.read_text()
          replacements = {
              '#fff3c8': 'var(--text)',
              'rgba(196, 154, 69, 0.22)': 'rgba(57, 136, 255, 0.18)',
              'rgba(196, 154, 69, 0.1)': 'rgba(57, 136, 255, 0.08)',
              'rgba(224, 186, 99, 0.35)': 'rgba(57, 136, 255, 0.34)',
              'rgba(196, 154, 69, 0.055)': 'rgba(57, 136, 255, 0.055)',
              '#d2aa54': '#82b0ff',
              'linear-gradient(180deg, #d4aa55, #b98b35)': 'linear-gradient(180deg, var(--red), var(--red-deep))',
              'color: #151109;': 'color: #fff;',
              'rgba(196, 154, 69, 0.18)': 'rgba(227, 60, 87, 0.2)',
              'rgba(210, 170, 84, 0.42)': 'rgba(57, 136, 255, 0.42)',
              'rgba(196, 154, 69, 0.16)': 'rgba(57, 136, 255, 0.14)',
              '#e6c36d': '#aecdff',
              'rgba(196, 154, 69, 0.09)': 'rgba(57, 136, 255, 0.08)',
              'rgba(210, 170, 84, 0.5)': 'rgba(57, 136, 255, 0.52)',
              'rgba(196, 154, 69, 0.08)': 'rgba(57, 136, 255, 0.08)',
              '#ead294': '#b9d2ff',
          }
          for old, new in replacements.items():
              css = css.replace(old, new)
          econ.write_text(css)

          team_css = Path('apps/web/app/teams/[teamId]/economy/team-economy.module.css')
          css = team_css.read_text()
          css = css.replace('rgba(240, 189, 100, 0.07)', 'rgba(227, 60, 87, 0.07)')
          css = css.replace('color: var(--amber);', 'color: #82b0ff;', 1)
          css = css.replace('border-color: rgba(240, 189, 100, 0.34);', 'border-color: rgba(227, 60, 87, 0.38);')
          css = css.replace('background: linear-gradient(180deg, rgba(240, 189, 100, 0.16), rgba(240, 189, 100, 0.08));', 'background: linear-gradient(180deg, rgba(227, 60, 87, 0.24), rgba(140, 29, 52, 0.18));')
          css = css.replace('color: #f4d69b;', 'color: #ffd7df;', 1)
          css = css.replace('border-color: rgba(240, 189, 100, 0.55);', 'border-color: rgba(227, 60, 87, 0.6);')
          css = css.replace('background: linear-gradient(180deg, rgba(240, 189, 100, 0.22), rgba(240, 189, 100, 0.11));', 'background: linear-gradient(180deg, rgba(227, 60, 87, 0.3), rgba(140, 29, 52, 0.22));')
          css = css.replace('color: var(--green) !important;', 'color: var(--silver) !important;')
          css = css.replace('border: 1px solid rgba(240, 189, 100, 0.2);', 'border: 1px solid rgba(57, 136, 255, 0.22);')
          css = css.replace('background: rgba(240, 189, 100, 0.045);', 'background: rgba(57, 136, 255, 0.05);')
          css = css.replace('color: #f4d69b;', 'color: #b9d2ff;')
          team_css.write_text(css)

          # Regression: missing local assets must not invoke fuzzy wiki API before exact redirect.
          test = Path('apps/web/src/item-image-path-regression.spec.ts')
          text = test.read_text()
          text = text.replace(
              "import { catalogItemForWikiFilename } from './server/item-image-proxy.js';",
              "import { catalogItemForWikiFilename, getCatalogWikiImageResponse } from './server/item-image-proxy.js';",
              1,
          )
          test_case = '''
  it('tries the exact wiki filename before fuzzy discovery for missing local assets', async () => {
    const requested: string[] = [];
    const fakeFetch = (async (input: string | URL | Request) => {
      const url = String(input);
      requested.push(url);
      if (url.includes('/Special:Redirect/file/Amulet_Karmy_1.png')) {
        return new Response(new Uint8Array([1, 2, 3]), {
          status: 200,
          headers: { 'content-type': 'image/png' },
        });
      }
      return new Response(null, { status: 404 });
    }) as typeof fetch;

    const response = await getCatalogWikiImageResponse('wiki_d69e989913be0bfd.png', fakeFetch);
    expect(response.status).toBe(200);
    expect(requested[0]).toContain('/Special:Redirect/file/Amulet_Karmy_1.png');
    expect(requested.some((url) => url.includes('/api.php'))).toBe(false);
  });
'''
          marker = '\n});\n'
          if text.count(marker) != 1:
              raise SystemExit('item image spec closing marker mismatch')
          text = text.replace(marker, test_case + marker, 1)
          test.write_text(text)

          print(f'catalog repair migration rows={len(rows)}')
          PY

      - name: Format touched files
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            apps/web/app/economy/economy.module.css \
            apps/web/app/teams/[teamId]/economy/team-economy.module.css \
            apps/web/app/teams/[teamId]/economy/team-economy.tsx \
            apps/web/app/teams/[teamId]/economy/drop-history-actions.tsx \
            apps/web/app/teams/[teamId]/economy/market-price-hint.tsx \
            apps/web/src/server/item-image-proxy.ts \
            apps/web/src/item-image-path-regression.spec.ts \
            services/player-team-service/src/infrastructure/db/team-economy.repository.ts

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'HOMZIKx'
          git config user.email 'ciborex12@gmail.com'
          git add apps/web services/player-team-service
          git commit -m 'fix(economy): align theme and repair catalog item resolution'
          git push origin HEAD:feat/economy-catalog-polish-20260909
