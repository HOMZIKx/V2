name: Economy catalog and cost cleanup

on:
  push:
    branches:
      - feat/economy-catalog-polish-20260909
    paths:
      - .github/workflows/economy-catalog-polish-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/economy-catalog-polish-20260909
      - name: Normalize cleanup matchers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply_economy_cost_catalog_cleanup.py')
          t = p.read_text()
          old = "    \"<small>{rangeLabel(range)} · katalog {catalogReady ? 'gotowy' : 'synchronizacja…'}</small>\",\n    \"<small>{rangeLabel(range)} · katalog centralny</small>\","
          new = "    \"\"\"<small>\n              {rangeLabel(range)} · katalog {catalogReady ? 'gotowy' : 'synchronizacja…'}\n            </small>\"\"\",\n    \"<small>{rangeLabel(range)} · katalog centralny</small>\","
          if old not in t:
              raise SystemExit('catalog label matcher source not found')
          t = t.replace(old, new, 1)
          t = t.replace('          label: expenseLabel.trim(),', '          label: expenseLabel,')
          t = t.replace('\\1', '\\\\g<1>')
          p.write_text(t)
          PY
      - name: Apply cleanup
        run: python3 .github/scripts/apply_economy_cost_catalog_cleanup.py
      - name: Format touched files
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            apps/web/app/economy/economy.module.css \
            apps/web/app/economy/private/page.tsx \
            apps/web/app/teams/[teamId]/economy/team-economy.tsx
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'HOMZIKx'
          git config user.email 'ciborex12@gmail.com'
          git add apps/web services/player-team-service
          git commit -m 'feat(economy): centralize catalog and link activity costs'
          git push origin HEAD:feat/economy-catalog-polish-20260909
