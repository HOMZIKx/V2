name: Economy data UX polish

on:
  push:
    branches:
      - feat/economy-catalog-polish-20260909
    paths:
      - .github/workflows/economy-catalog-polish-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/economy-catalog-polish-20260909
      - name: Normalize patch matchers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply_economy_data_ux_polish.py')
          text = p.read_text()
          text = text.replace('">Tydzień<": ">Bilans<",', '"            Tydzień\\n": "            Bilans\\n",')
          text = text.replace('">Dochodowość<": ">Źródła dropu<",', '"            Dochodowość\\n": "            Źródła dropu\\n",')
          p.write_text(text)
          PY
      - name: Apply patch
        run: python3 .github/scripts/apply_economy_data_ux_polish.py
      - name: Format touched files
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            apps/web/app/economy/economy.module.css \
            apps/web/app/economy/private/page.tsx \
            apps/web/app/teams/[teamId]/economy/team-economy.module.css \
            apps/web/app/teams/[teamId]/economy/team-economy.tsx
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'HOMZIKx'
          git config user.email 'ciborex12@gmail.com'
          git add apps/web
          git commit -m 'feat(economy): add period filters and complete private catalog binding'
          git push origin HEAD:feat/economy-catalog-polish-20260909
