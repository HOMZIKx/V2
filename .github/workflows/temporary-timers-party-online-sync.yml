name: Temporary Timers Party Online Sync

on:
  push:
    branches:
      - fix/timers-party-online-sync-20260908

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: fix/timers-party-online-sync-20260908
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply online sync hardening
        run: node tools/scripts/apply-timers-party-online-sync.mjs

      - name: Format touched files
        run: >-
          pnpm exec prettier --write
          apps/web/src/player-team-rooms-api.ts
          apps/web/app/maps/party-hunt.tsx
          services/player-team-service/src/domain/ports/hunt-rooms.port.ts
          services/player-team-service/src/application/use-cases/hunt-rooms.use-cases.ts
          services/player-team-service/src/interface/hunt-rooms.controller.ts
          services/player-team-service/src/infrastructure/db/hunt-rooms.repository.ts
          services/player-team-service/src/application/use-cases/hunt-rooms.use-cases.spec.ts

      - name: Player Team hunt room tests
        run: pnpm exec vitest run services/player-team-service/src/application/use-cases/hunt-rooms.use-cases.spec.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/player-team-rooms-api.ts \
            apps/web/app/maps/party-hunt.tsx \
            services/player-team-service/src/domain/ports/hunt-rooms.port.ts \
            services/player-team-service/src/application/use-cases/hunt-rooms.use-cases.ts \
            services/player-team-service/src/interface/hunt-rooms.controller.ts \
            services/player-team-service/src/infrastructure/db/hunt-rooms.repository.ts \
            services/player-team-service/src/application/use-cases/hunt-rooms.use-cases.spec.ts
          git commit -m "fix(hunt): make timers and party shared online state authoritative"
          git push origin HEAD:fix/timers-party-online-sync-20260908
