name: Economy canonical catalog generation

on:
  push:
    branches:
      - feat/economy-catalog-polish-clean-20260909
    paths:
      - .github/workflows/economy-catalog-generate.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/economy-catalog-polish-clean-20260909
      - name: Audit canonical image gaps
        run: python3 .github/scripts/audit_missing_catalog_images.py
      - name: Generate migrations and regression test
        run: python3 .github/scripts/generate_economy_catalog_migrations.py
      - name: Format regression test
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --write apps/web/src/item-image-path-regression.spec.ts
      - name: Commit generated product files
        shell: bash
        run: |
          git config user.name 'HOMZIKx'
          git config user.email 'ciborex12@gmail.com'
          git add apps/web/src/item-image-path-regression.spec.ts services/player-team-service/migrations
          git commit -m 'fix(economy): repair and seed canonical item catalog'
          git push origin HEAD:feat/economy-catalog-polish-clean-20260909
