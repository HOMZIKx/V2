name: Auth session hardening (temporary)

on:
  push:
    branches:
      - repair/auth-callback-session-proof-20260907

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          pnpm install --frozen-lockfile
      - name: Apply auth hardening patch
        run: node tools/scripts/auth-session-hardening-temp.mjs
      - name: Format touched files
        run: |
          pnpm exec prettier --write \
            apps/web/src/player-store.ts \
            apps/web/src/identity-auth-client.ts \
            apps/web/src/identity-auth-client.spec.ts \
            apps/web/app/auth/callback/page.tsx
      - name: Verify focused auth tests and web checks
        run: |
          pnpm --filter @v2/web exec vitest run src/identity-auth-client.spec.ts --config vitest.config.ts
          pnpm --filter @v2/web lint
          pnpm --filter @v2/web typecheck
      - name: Commit verified patch and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/player-store.ts \
            apps/web/src/identity-auth-client.ts \
            apps/web/src/identity-auth-client.spec.ts \
            apps/web/app/auth/callback/page.tsx
          git rm .github/workflows/auth-session-hardening-temp.yml tools/scripts/auth-session-hardening-temp.mjs
          git commit -m "fix(web): remove unauthenticated auth fallbacks"
          git push origin HEAD:repair/auth-callback-session-proof-20260907
