name: Temporary Team Sync Verify

on:
  push:
    branches:
      - 'fix/team-sync-timers-war-20260908'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck repository
        run: pnpm typecheck

      - name: Test Discord team coordination
        run: >-
          pnpm exec vitest run --config apps/discord-gateway/vitest.config.ts
          apps/discord-gateway/src/application/notify/notify-payload.spec.ts
          apps/discord-gateway/src/application/notify/kingdom-war-claims.spec.ts
          apps/discord-gateway/src/infrastructure/player-team/confirm-character-timer.spec.ts
          apps/discord-gateway/src/presentation/discord/team-coordination-renderers.spec.ts

      - name: Test web timer coordination
        run: >-
          pnpm exec vitest run --config apps/web/vitest.config.ts
          apps/web/src/character-timer-discord-notify.spec.ts
          apps/web/src/discord-notify-api.spec.ts

      - name: Build repository
        run: pnpm build
