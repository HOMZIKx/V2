name: Fix economy patcher anchor
on:
  push:
    branches: [fix/economy-ai-recognition-20260909]
    paths: [.github/workflows/fix-economy-patcher-anchor.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/economy-ai-recognition-20260909
      - name: Fix team import depth
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/patch-economy-ai-recognition.py')
          s=p.read_text()
          s=s.replace("team_import = \"import { economyAiErrorMessage } from '../../../src/economy-ai-error';\\n\"", "team_import = \"import { economyAiErrorMessage } from '../../../../src/economy-ai-error';\\n\"")
          s=s.replace("team_anchor = \"import { resolveAiObservationFeedback } from '../../../src/ai-observation-feedback';\\n\"", "team_anchor = \"import { resolveAiObservationFeedback } from '../../../../src/ai-observation-feedback';\\n\"")
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name HOMZIKx
          git config user.email ciborex12@gmail.com
          git add .github/scripts/patch-economy-ai-recognition.py
          git commit -m 'chore: fix economy AI patcher anchor'
          git push origin HEAD:fix/economy-ai-recognition-20260909
