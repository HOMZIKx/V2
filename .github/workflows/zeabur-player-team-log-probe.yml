name: Zeabur player-team log probe

on:
  push:
    branches:
      - fix/e2e-service-wiring-20260908
    paths:
      - .github/workflows/zeabur-player-team-log-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect latest player-team deployment logs safely
        env:
          ZEABUR_API_TOKEN: ${{ secrets.zebur }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          token=os.environ.get('ZEABUR_API_TOKEN','').strip(); endpoint='https://api.zeabur.com/graphql'
          if not token:
              print('::error::Missing Zeabur token'); sys.exit(1)
          def gql(q,v=None):
              r=subprocess.run(['curl','-sS','--fail-with-body','-X','POST',endpoint,'-H',f'Authorization: Bearer {token}','-H','Content-Type: application/json','--data-binary',json.dumps({'query':q,'variables':v or {}})],capture_output=True,text=True,timeout=40)
              if r.returncode:
                  print('::error::Zeabur transport failed'); sys.exit(1)
              b=json.loads(r.stdout)
              if b.get('errors'):
                  print('::error::Zeabur GraphQL: '+str(b['errors'][0].get('message','unknown'))[:180]); sys.exit(1)
              return b.get('data') or {}
          root=gql('query{projects{edges{node{_id name}}}}'); ps=[e['node'] for e in root['projects']['edges']]
          p=next((x for x in ps if x['name']=='untitled-1'),None) or (ps[0] if len(ps)==1 else None)
          if not p: print('::error::Project not resolved'); sys.exit(1)
          d=gql('query($id:ObjectID!){project(_id:$id){environments{_id name} services{_id name}}}',{'id':p['_id']})['project']
          env=next(x for x in d['environments'] if x['name']=='production'); svc=next(x for x in d['services'] if x['name']=='player-team-service')
          depq='query($serviceID:ObjectID!,$environmentID:ObjectID!){deployments(serviceID:$serviceID,environmentID:$environmentID,perPage:1){edges{node{_id status ref commitSHA commitMessage createdAt startedAt finishedAt}}}}'
          edges=((gql(depq,{'serviceID':svc['_id'],'environmentID':env['_id']}).get('deployments') or {}).get('edges') or [])
          if not edges: print('::error::No deployment found'); sys.exit(1)
          dep=edges[0]['node']; depid=dep['_id']
          print(f"deployment_status={dep.get('status')} sha={str(dep.get('commitSHA') or '')[:12]} ref={dep.get('ref')}")
          logq='query($deploymentID:ObjectID!,$serviceID:ObjectID!,$environmentID:ObjectID!){buildLogs(deploymentID:$deploymentID){timestamp message} runtimeLogs(serviceID:$serviceID,environmentID:$environmentID,deploymentID:$deploymentID){timestamp message}}'
          data=gql(logq,{'deploymentID':depid,'serviceID':svc['_id'],'environmentID':env['_id']})
          url_re=re.compile(r'https?://\S+')
          token_re=re.compile(r'(?i)(bearer\s+)[A-Za-z0-9._-]+')
          secretish=re.compile(r'(?i)(password|token|secret|apikey|api_key|database_url|postgres(?:ql)?://)')
          interesting=re.compile(r'(?i)(error|fail|fatal|exception|exit|removed|suspend|build|start|listen|health|migration|docker|pnpm|npm|node|ready)')
          def clean(msg):
              msg=url_re.sub('<url>',msg)
              msg=token_re.sub(r'\1<redacted>',msg)
              if secretish.search(msg):
                  parts=msg.split('=',1)
                  if len(parts)==2: msg=parts[0]+'=<redacted>'
              return msg.replace('\n',' ')[:500]
          for label in ('buildLogs','runtimeLogs'):
              logs=data.get(label) or []
              print(f'{label}_count={len(logs)}')
              shown=0
              for item in logs[-200:]:
                  msg=str(item.get('message') or '')
                  if interesting.search(msg):
                      print(f'{label}: '+clean(msg))
                      shown+=1
                      if shown>=80: break
              if shown==0:
                  print(f'{label}: <no interesting lines>')
          PY
