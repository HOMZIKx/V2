export type PartyChannelView = number | 'all';

/** Stable visual identity for Party channels. Pins always keep the color of their stored channel. */
export const PARTY_CHANNEL_COLORS = {
  1: '#4f8cff',
  2: '#22c55e',
  3: '#f59e0b',
  4: '#ef4444',
  5: '#a855f7',
  6: '#06b6d4',
  7: '#f472b6',
  8: '#eab308',
} as const;

export function partyChannelColor(channel: number): string {
  return PARTY_CHANNEL_COLORS[channel as keyof typeof PARTY_CHANNEL_COLORS] ?? '#94a3b8';
}

/** ALL is a read-only filter. Only a concrete CH1-CH8 may be persisted on a party or pin. */
export function concretePartyChannel(view: PartyChannelView): number | null {
  return typeof view === 'number' && Number.isInteger(view) && view >= 1 && view <= 8
    ? view
    : null;
}
""",
          )
