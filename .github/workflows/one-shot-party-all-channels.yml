name: One-shot Party all-channel patch

on:
  push:
    branches:
      - fix/party-all-channels-colors-20260908

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/party-all-channels-colors-20260908
          fetch-depth: 0
      - name: Apply Party channel-view patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:100]!r}')
              path.write_text(text.replace(old, new, 1))

          map_party = Path('apps/web/src/map-party.ts')
          replace_once(
              map_party,
              "export type ScoutPinKind = RespawnKind | 'spot';\n",
