name: Temporary targeted lint repair

on:
  push:
    branches:
      - 'maintenance/restore-green-ci-20260907'

permissions:
  contents: write

jobs:
  repair:
    if: github.ref == 'refs/heads/maintenance/restore-green-ci-20260907'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: maintenance/restore-green-ci-20260907

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply exact lint repairs
        run: python3 .github/scripts/targeted-lint-repair.py

      - name: Format only repaired files
        run: |
          pnpm exec prettier --write \
            services/player-team-service/src/application/use-cases/hunt-rooms.use-cases.spec.ts \
            services/player-team-service/src/infrastructure/db/hunt-rooms.repository.ts \
            apps/discord-gateway/src/infrastructure/discord/discord-js-adapter.ts \
            apps/discord-gateway/src/infrastructure/player-team/confirm-character-timer.spec.ts \
            apps/discord-gateway/src/interface/discord/interaction-router.spec.ts \
            apps/discord-gateway/src/interface/http/notify.controller.spec.ts \
            apps/discord-gateway/src/interface/http/technika-config.controller.ts

      - name: Remove temporary repair files, commit and push
        run: |
          git rm .github/workflows/targeted-lint-repair-temp.yml .github/scripts/targeted-lint-repair.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/player-team-service/src/application/use-cases/hunt-rooms.use-cases.spec.ts \
            services/player-team-service/src/infrastructure/db/hunt-rooms.repository.ts \
            apps/discord-gateway/src/infrastructure/discord/discord-js-adapter.ts \
            apps/discord-gateway/src/infrastructure/player-team/confirm-character-timer.spec.ts \
            apps/discord-gateway/src/interface/discord/interaction-router.spec.ts \
            apps/discord-gateway/src/interface/http/notify.controller.spec.ts \
            apps/discord-gateway/src/interface/http/technika-config.controller.ts
          git commit -m "fix(ci): repair remaining typed lint blockers"
          git push origin HEAD:maintenance/restore-green-ci-20260907
