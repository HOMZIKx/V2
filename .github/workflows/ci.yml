name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'cursor/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Restore Nx cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-nx-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run complete validation
        run: pnpm validate
        env:
          CI: 'true'

      - name: Audit production dependencies
        run: pnpm audit --audit-level=high

  infra-integration:
    name: Infrastructure integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Compose file
        run: docker compose -f infrastructure/docker/docker-compose.yml config

      - name: Start local infrastructure
        run: |
          docker compose -f infrastructure/docker/docker-compose.yml up -d --wait || {
            echo 'Compose failed; dumping postgres logs'
            docker compose -f infrastructure/docker/docker-compose.yml logs postgres || true
            docker compose -f infrastructure/docker/docker-compose.yml ps || true
            exit 1
          }

      - name: Verify container health
        run: |
          docker compose -f infrastructure/docker/docker-compose.yml ps
          docker compose -f infrastructure/docker/docker-compose.yml exec -T redis redis-cli ping | grep -q PONG
          docker compose -f infrastructure/docker/docker-compose.yml exec -T rabbitmq rabbitmq-diagnostics -q ping
          docker compose -f infrastructure/docker/docker-compose.yml exec -T postgres pg_isready -U v2_admin -d postgres

      - name: Verify database isolation
        run: pnpm test:infra
        env:
          RUN_INFRA_TESTS: 'true'
          IDENTITY_DATABASE_URL: postgresql://identity:identity_dev_password@127.0.0.1:5432/identity
          IDENTITY_REDIS_URL: redis://127.0.0.1:6379/1

      - name: Migrate identity database
        run: pnpm --dir services/identity-service migrate
        env:
          IDENTITY_DATABASE_URL: postgresql://identity:identity_dev_password@127.0.0.1:5432/identity

      - name: Run identity auth integration tests
        run: pnpm exec vitest run --config services/identity-service/vitest.config.ts
        env:
          RUN_INFRA_TESTS: 'true'
          IDENTITY_AUTH_ENABLED: 'true'
          IDENTITY_DATABASE_URL: postgresql://identity:identity_dev_password@127.0.0.1:5432/identity
          IDENTITY_REDIS_URL: redis://127.0.0.1:6379/1
          IDENTITY_AUTH_BASE_URL: http://127.0.0.1:4200
          IDENTITY_AUTH_BASE_PATH: /api/auth
          IDENTITY_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
          # CI-only non-secret placeholders (>= 32 chars); no real OAuth is performed.
          IDENTITY_BETTER_AUTH_SECRET: ci-placeholder-better-auth-secret-000000
          IDENTITY_DISCORD_CLIENT_ID: ci-discord-client-id
          IDENTITY_DISCORD_CLIENT_SECRET: ci-discord-client-secret
          IDENTITY_GOOGLE_CLIENT_ID: ci-google-client-id
          IDENTITY_GOOGLE_CLIENT_SECRET: ci-google-client-secret

      - name: Stop local infrastructure
        if: always()
        run: docker compose -f infrastructure/docker/docker-compose.yml down -v

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
