name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Restore Nx cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-nx-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test:coverage

      - name: Check architecture boundaries
        run: pnpm architecture:check

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end smoke tests
        run: pnpm test:e2e

      - name: Run runtime smoke tests
        run: pnpm test:runtime-smoke

      - name: Run complete validation
        run: pnpm validate

      - name: Audit production dependencies
        run: pnpm audit --audit-level=high

  infra-integration:
    name: Infrastructure integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Compose file
        run: docker compose -f infrastructure/docker/docker-compose.yml config

      - name: Start local infrastructure
        run: docker compose -f infrastructure/docker/docker-compose.yml up -d --wait

      - name: Verify container health
        run: |
          docker compose -f infrastructure/docker/docker-compose.yml ps
          docker compose -f infrastructure/docker/docker-compose.yml exec -T redis redis-cli ping | grep -q PONG
          docker compose -f infrastructure/docker/docker-compose.yml exec -T rabbitmq rabbitmq-diagnostics -q ping
          docker compose -f infrastructure/docker/docker-compose.yml exec -T postgres pg_isready -U v2_admin -d postgres

      - name: Verify database isolation
        run: pnpm test:infra
        env:
          RUN_INFRA_TESTS: 'true'

      - name: Stop local infrastructure
        if: always()
        run: docker compose -f infrastructure/docker/docker-compose.yml down -v

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
