name: One-shot Technika runtime docs

on:
  push:
    branches:
      - docs/technika-pr68-runtime-proof-20260908
    paths:
      - ops/append-technika-runtime-proof-once.py
      - .github/workflows/one-shot-technika-runtime-docs.yml

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/technika-pr68-runtime-proof-20260908
      - run: python ops/append-technika-runtime-proof-once.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ai/FIX_LOG.md docs/ai/PROJECT_STATE.md docs/ai/CURSOR_TO_CHATGPT.md
          git commit -m 'docs(ai): close Technika live DM runtime proof'
          git push origin HEAD:docs/technika-pr68-runtime-proof-20260908
