name: tmp-party-all-active-state

on:
  push:
    branches:
      - fix/party-all-channels-remove-hunts-all-20260908

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/party-all-channels-remove-hunts-all-20260908
      - name: Fix active channel state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/app/maps/party-hunt.tsx')
          text = path.read_text()
          old = """                <button
                  aria-pressed={value === channel}
                  className={value === channel ? 'is-active' : ''}
                  key={value}"""
          new = """                <button
                  aria-pressed={!allChannels && value === channel}
                  className={!allChannels && value === channel ? 'is-active' : ''}
                  key={value}"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one channel button block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/tmp-party-all-active-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/maps/party-hunt.tsx .github/workflows/tmp-party-all-active-state.yml
          git commit -m "fix(web): keep Party channel selector state exclusive"
          git push origin HEAD:fix/party-all-channels-remove-hunts-all-20260908
