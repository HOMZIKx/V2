name: CI targeted test fixes (temporary)

on:
  push:
    branches:
      - maintenance/restore-green-ci-20260907

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Apply exact fixes
        run: node tools/scripts/ci-targeted-test-fixes.mjs
      - name: Format touched files
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          pnpm exec prettier --write \
            apps/discord-gateway/src/infrastructure/discord/discord-js-adapter.spec.ts \
            apps/discord-gateway/src/interface/discord/interaction-router.ts \
            apps/discord-gateway/src/application/technika/capabilities.ts \
            apps/web/src/timers-metin-counts.spec.ts \
            services/player-team-service/src/infrastructure/db/hunt-rooms.repository.spec.ts
      - name: Commit clean result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/discord-gateway/src/infrastructure/discord/discord-js-adapter.spec.ts \
            apps/discord-gateway/src/interface/discord/interaction-router.ts \
            apps/discord-gateway/src/application/technika/capabilities.ts \
            apps/web/src/timers-metin-counts.spec.ts \
            services/player-team-service/src/infrastructure/db/hunt-rooms.repository.spec.ts
          git rm .github/workflows/ci-targeted-test-fixes-temp.yml tools/scripts/ci-targeted-test-fixes.mjs
          git commit -m "test(ci): align baseline tests with current contracts"
          git push origin HEAD:maintenance/restore-green-ci-20260907
