name: Zeabur connectivity check

on:
  push:
    branches:
      - preview/destiled-web
    paths:
      - .github/workflows/zeabur-connectivity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zeabur-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Zeabur API token
        env:
          ZEABUR_API_TOKEN: ${{ secrets.zebur }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ZEABUR_API_TOKEN:-}" ]; then
            echo "::error::GitHub Actions secret 'zebur' is missing or empty."
            exit 1
          fi
          http_code="$({ curl --silent --show-error \
            --output zeabur-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --url 'https://api.zeabur.com/graphql' \
            --header "Authorization: Bearer ${ZEABUR_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{"query":"query { me { username } }"}'; } 2>curl-error.log)" || {
              cat curl-error.log >&2
              exit 1
            }
          if [ "${http_code}" != "200" ]; then
            echo "::error::Zeabur API returned HTTP ${http_code}."
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          with open('zeabur-response.json', 'r', encoding='utf-8') as fh:
              payload = json.load(fh)
          if payload.get('errors'):
              print('::error::Zeabur GraphQL API returned an authentication/query error.')
              sys.exit(1)
          username = (((payload.get('data') or {}).get('me') or {}).get('username'))
          if not isinstance(username, str) or not username.strip():
              print('::error::Zeabur API response did not contain an authenticated user.')
              sys.exit(1)
          print('::notice::Zeabur API authentication OK.')
          PY

      - name: Read-only Zeabur runtime inventory
        env:
          ZEABUR_API_TOKEN: ${{ secrets.zebur }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          endpoint = 'https://api.zeabur.com/graphql'
          token = os.environ.get('ZEABUR_API_TOKEN', '').strip()
          if not token:
              print('::error::Zeabur API token is unavailable.')
              sys.exit(1)

          def error_summary(payload):
              if not isinstance(payload, dict):
                  return 'unknown GraphQL error'
              messages = []
              for item in payload.get('errors') or []:
                  if isinstance(item, dict) and isinstance(item.get('message'), str):
                      messages.append(item['message'].replace('\n', ' ')[:240])
              return ' | '.join(messages[:3]) or 'unknown GraphQL error'

          def gql(query, variables=None, *, required=True, label='query'):
              body = json.dumps({'query': query, 'variables': variables or {}})
              result = subprocess.run(
                  [
                      'curl', '--silent', '--show-error',
                      '--request', 'POST', '--url', endpoint,
                      '--header', f'Authorization: Bearer {token}',
                      '--header', 'Content-Type: application/json',
                      '--data-binary', body,
                      '--write-out', '\n%{http_code}',
                  ],
                  check=False,
                  capture_output=True,
                  text=True,
                  timeout=25,
              )
              raw, separator, status = result.stdout.rpartition('\n')
              if result.returncode != 0 or not separator:
                  if required:
                      print(f'::error::Zeabur {label} transport failed (curl={result.returncode}).')
                      sys.exit(1)
                  return None
              try:
                  payload = json.loads(raw)
              except json.JSONDecodeError:
                  if required:
                      print(f'::error::Zeabur {label} returned non-JSON HTTP {status}.')
                      sys.exit(1)
                  return None
              if status != '200' or payload.get('errors'):
                  summary = error_summary(payload)
                  if required:
                      print(f'::error::Zeabur {label} failed HTTP {status}: {summary}')
                      sys.exit(1)
                  print(f'ZEABUR_QUERY label={label!r} status=unavailable detail={summary!r}')
                  return None
              return payload.get('data') or {}

          root = gql('''
            query RuntimeInventoryRoot {
              teams { _id name myRole }
              projects { edges { node { _id name } } }
            }
          ''', label='inventory-root')

          owners = [('personal', None)]
          projects = []
          for edge in ((root.get('projects') or {}).get('edges') or []):
              project = edge.get('node') or {}
              if project.get('_id'):
                  projects.append(('personal', project))

          for team in root.get('teams') or []:
              team_id = team.get('_id')
              team_name = team.get('name') or 'unnamed-team'
              role = team.get('myRole') or 'unknown'
              if isinstance(team_id, str) and team_id:
                  print(f'ZEABUR_TEAM name={team_name!r} id={team_id} role={role}')
                  owners.append((f'team:{team_name}', team_id))

          team_projects_query = '''
            query TeamProjects($ownerID: ObjectID!) {
              projects(ownerID: $ownerID) { edges { node { _id name } } }
            }
          '''
          for owner_label, owner_id in owners[1:]:
              data = gql(team_projects_query, {'ownerID': owner_id}, required=False, label=f'projects:{owner_label}')
              if not data:
                  continue
              for edge in ((data.get('projects') or {}).get('edges') or []):
                  project = edge.get('node') or {}
                  if project.get('_id'):
                      projects.append((owner_label, project))

          # Zeabur's project query uses `_id`, not `id`.
          detail_query = '''
            query ProjectInventory($id: ObjectID!) {
              project(_id: $id) {
                _id
                name
                services { _id name }
                environments { _id name }
              }
            }
          '''
          variables_query = '''
            query ServiceVariables($serviceID: ObjectID!, $environmentID: ObjectID!) {
              variables(serviceID: $serviceID, environmentID: $environmentID) { key value }
            }
          '''

          watched_keys = (
              'V2_BACKEND_PUBLIC_ORIGIN',
              'IDENTITY_PROXY_TARGET',
              'PLAYER_TEAM_PROXY_TARGET',
              'ACTIVITY_PROXY_TARGET',
              'DISCORD_GATEWAY_PROXY_TARGET',
              'DISCORD_GATEWAY_BASE_URL',
              'INTERNAL_JWT_CLIENT_ENABLED',
              'PLAYER_TEAM_INTERNAL_JWT_ENABLED',
              'DISCORD_GATEWAY_DATA_DIR',
              'DESTILED_DATA_DIR',
              'DISCORD_ENABLED',
              'GEMINI_API_KEY',
              'GEMINI_VISION_MODEL',
              'TECHNIKA_ADMIN_DISCORD_IDS',
          )

          seen = set()
          for owner_label, project in projects:
              project_id = project.get('_id')
              if not isinstance(project_id, str) or not project_id or project_id in seen:
                  continue
              seen.add(project_id)
              detail = gql(detail_query, {'id': project_id}, required=False, label=f'project:{project_id}')
              if not detail or not detail.get('project'):
                  print(f'ZEABUR_PROJECT owner={owner_label!r} name={project.get("name")!r} id={project_id} detail=unavailable')
                  continue
              node = detail['project']
              print(f'ZEABUR_PROJECT owner={owner_label!r} name={node.get("name")!r} id={project_id}')
              environments = node.get('environments') or []
              services = node.get('services') or []
              for environment in environments:
                  environment_id = environment.get('_id')
                  if not environment_id:
                      continue
                  print(f'ZEABUR_ENV project={project_id} name={environment.get("name")!r} id={environment_id}')
                  for service in services:
                      service_id = service.get('_id')
                      if not service_id:
                          continue
                      flags = {key: 'unknown' for key in watched_keys}
                      vars_data = gql(
                          variables_query,
                          {'serviceID': service_id, 'environmentID': environment_id},
                          required=False,
                          label=f'variables:{service.get("name") or service_id}',
                      )
                      if vars_data is not None:
                          values = {
                              item.get('key'): item.get('value')
                              for item in (vars_data.get('variables') or [])
                              if isinstance(item, dict) and isinstance(item.get('key'), str)
                          }
                          for key in watched_keys:
                              value = values.get(key)
                              flags[key] = 'set' if isinstance(value, str) and value.strip() else 'unset'
                      safe_flags = ' '.join(f'{key}={flags[key]}' for key in watched_keys)
                      print(
                          f'ZEABUR_SERVICE project={project_id} env={environment_id} '
                          f'name={service.get("name")!r} id={service_id} {safe_flags}'
                      )

          if not seen:
              print('::warning::No Zeabur projects were visible to the configured API token.')
          PY
