name: Patch economy AI fallback
on:
  push:
    branches: [fix/economy-ai-recognition-20260909]
    paths:
      - .github/scripts/patch-economy-ai-fallback.py
      - .github/workflows/patch-economy-ai-fallback.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/economy-ai-recognition-20260909
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@10.14.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: python3 .github/scripts/patch-economy-ai-fallback.py
      - run: pnpm exec prettier --write apps/web/app/api/team-economy/recognize/route.ts
      - name: Validate web
        run: |
          pnpm --dir apps/web exec vitest run --config vitest.config.ts src/economy-ai-error.spec.ts
          pnpm --dir apps/web typecheck
      - name: Commit product change
        run: |
          git config user.name HOMZIKx
          git config user.email ciborex12@gmail.com
          git add apps/web/app/api/team-economy/recognize/route.ts
          git commit -m 'fix(economy): fall back to current Gemini Flash'
          git push origin HEAD:fix/economy-ai-recognition-20260909
