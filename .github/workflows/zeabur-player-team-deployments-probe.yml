name: Zeabur player-team deployments probe
on:
  push:
    branches: [fix/e2e-service-wiring-20260908]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect deployment history
        env:
          ZEABUR_API_TOKEN: ${{ secrets.zebur }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          token=os.environ['ZEABUR_API_TOKEN'].strip(); endpoint='https://api.zeabur.com/graphql'
          def gql(q,v=None):
            r=subprocess.run(['curl','-sS','--fail-with-body','-X','POST',endpoint,'-H',f'Authorization: Bearer {token}','-H','Content-Type: application/json','--data-binary',json.dumps({'query':q,'variables':v or {}})],capture_output=True,text=True,timeout=40)
            if r.returncode: print('::error::Zeabur transport failed');sys.exit(1)
            b=json.loads(r.stdout)
            if b.get('errors'): print('::error::Zeabur GraphQL: '+str(b['errors'][0].get('message','unknown'))[:180]);sys.exit(1)
            return b.get('data') or {}
          root=gql('query{projects{edges{node{_id name}}}}'); ps=[e['node'] for e in root['projects']['edges']]
          p=next((x for x in ps if x['name']=='untitled-1'),None) or (ps[0] if len(ps)==1 else None)
          if not p: print('::error::Project not resolved');sys.exit(1)
          d=gql('query($id:ObjectID!){project(_id:$id){environments{_id name} services{_id name}}}',{'id':p['_id']})['project']
          env=next(x for x in d['environments'] if x['name']=='production'); service=next(x for x in d['services'] if x['name']=='player-team-service')
          q='query($serviceID:ObjectID!,$environmentID:ObjectID!,$perPage:Int!){deployments(serviceID:$serviceID,environmentID:$environmentID,perPage:$perPage){edges{node{_id status ref commitSHA commitMessage createdAt startedAt finishedAt}}}}'
          data=gql(q,{'serviceID':service['_id'],'environmentID':env['_id'],'perPage':10})
          for i,e in enumerate((data.get('deployments') or {}).get('edges') or []):
            n=e.get('node') or {}
            print(f"deployment[{i}] status={n.get('status')} ref={n.get('ref')} sha={str(n.get('commitSHA') or '')[:12]} created={n.get('createdAt')} msg={str(n.get('commitMessage') or '')[:120]}")
          PY