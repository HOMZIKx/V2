name: One-shot equipment delivery docs

on:
  push:
    branches:
      - feat/equipment-inventory-screenshot-import-20260908
    paths:
      - .github/workflows/eq-docs-once.yml

permissions:
  contents: write

jobs:
  document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/equipment-inventory-screenshot-import-20260908
          fetch-depth: 0

      - name: Update required AI continuity documents
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          fix_path = Path('docs/ai/FIX_LOG.md')
          fix = fix_path.read_text(encoding='utf-8')
          fix_entry = '''## 2026-09-08 17:31 — EQ: Torby / Magazyn + import pojedynczego itemu ze screena

          - **Status:** `PARTIAL` — implementacja oraz CI są potwierdzone; produkcyjny runtime analizy AI pozostaje zablokowany wyłącznie przez brak `OPENAI_API_KEY` w usłudze `webapp-dest`. Sam moduł EQ nie wymaga tego klucza.
          - **Obszar:** DESTILED Web, karta postaci / EQ, Player Team persistence, katalog itemów, screenshot import.
          - **Problem / kierunek właściciela:** dotychczasowy ekran EQ nie odpowiadał docelowemu modelowi dużej torby. Właściciel wymaga osobnych widoków `Założone` i `Torba`, zakładek `Torba I`, `Torba II`, `Magazyn`, ręcznego zarządzania itemami oraz importu pojedynczego tooltipa ze screena z obowiązkowym podglądem/korektą przed zapisem.
          - **Poprawka:** dodano nowy widok EQ z 8 slotami założonego sprzętu, pojemnymi siatkami Torba I/Torba II/Magazyn, panelem szczegółów, zakładaniem/zdejmowaniem/przenoszeniem, miękkim usuwaniem, ręcznym dodawaniem oraz edycją `+N` i bonusów. Lokalizacja wykorzystuje istniejące `lastConfirmedLocation`, więc przechodzi przez obecny `PlayerStoreState → player-team-service snapshot sync → PostgreSQL` bez nowej migracji. Timery pozostają na istniejącym komponencie.
          - **Screenshot import:** `POST /api/equipment/analyze-item` przyjmuje tylko PNG/JPEG/WEBP do 8 MB, wysyła pojedynczy tooltip do OpenAI Responses API i zwraca wyłącznie draft `{name, enhancement, bonuses, confidence, notes}`. Endpoint nigdy nie zapisuje danych. UI wymaga jawnego `Potwierdź i dodaj`; po analizie użytkownik może skorygować nazwę, +N, slot i bonusy.
          - **Katalog:** istniejący `dobry-temat-item-catalog.json` pozostaje źródłem głównym V2. Audyt potwierdził, że dane kategorii `Ulepszacze` już są w tym dumpie (m.in. Agat, Amulet Orka, Biała Perła); nie wykonano duplikującego importu starej bazy.
          - **Zmienione pliki:** `apps/web/app/api/equipment/analyze-item/route.ts`, `apps/web/app/teams/[teamId]/characters/[characterId]/character-equipment-v2.tsx`, `.module.css`, `.module.css.d.ts`, `page.tsx`, `.env.example`.
          - **Commit / PR:** branch `feat/equipment-inventory-screenshot-import-20260908`, PR `#72` do `preview/destiled-web`.
          - **Walidacja:** pierwszy CI `34244773241` poprawnie wykrył TS2322 dla klas CSS slotów. Po lokalnym typowaniu CSS drugi CI `34244943904` zakończył `Quality gates`, `Infrastructure integration` i `Secret scan` statusem `success`; preview `pnpm typecheck` + `pnpm build`, dependency audit i 28 regresji Discord Gateway przeszły.
          - **Zeabur audit:** read-only run `34245160534` potwierdził `webapp-dest` jako `RUNNING` na `preview/destiled-web`, bez `OPENAI_API_KEY`; wartości sekretów pozostają zredagowane przez bridge. Legacy `web` jest osobnym zawieszonym serwisem i nie jest celem deployu.
          - **Pozostałe ryzyka:** screenshot AI po deployu będzie zwracał kontrolowane `503`, dopóki właściciel nie doda `OPENAI_API_KEY` do Variables `webapp-dest`. `OPENAI_VISION_MODEL` jest opcjonalny; domyślny model to `gpt-5.6-luna`. Pełny produkcyjny `WWW → API → Player Team → DB → reload` dla nowego EQ należy potwierdzić po merge/deploy i realnym zalogowaniu Discord OAuth.

          '''
          marker = '# Wpisy\n\n'
          if 'EQ: Torby / Magazyn + import pojedynczego itemu ze screena' not in fix:
              if marker not in fix:
                  raise SystemExit('FIX_LOG marker not found')
              fix = fix.replace(marker, marker + fix_entry, 1)
              fix_path.write_text(fix, encoding='utf-8')

          state_path = Path('docs/ai/PROJECT_STATE.md')
          state = state_path.read_text(encoding='utf-8')
          state_entry = '''### EQ / Torby / Magazyn / screenshot import — 2026-09-08

          - PR #72 przebudowuje kartę EQ na osobne `Założone` i `Torba` oraz `Torba I` / `Torba II` / `Magazyn`; zachowuje istniejące timery.
          - Ręczne itemy korzystają z obecnego Player Team snapshot persistence; lokalizacja torby jest zapisywana przez `lastConfirmedLocation`, bez nowej migracji DB.
          - Import pojedynczego tooltipa ze screena działa jako `analiza → draft → korekta → jawne potwierdzenie`; analiza sama nie zapisuje danych ani nie modyfikuje globalnego katalogu.
          - Katalog V2 już zawiera kategorię `Ulepszacze`; nie duplikować importu z DOBRYTEMAT. Brak dotyczy warstwy użycia tych danych, nie samego dumpa.
          - CI #34244943904 PASS po korekcie lokalnego typowania CSS.
          - Runtime screenshot AI: kod gotowy, lecz `webapp-dest` nie ma jeszcze `OPENAI_API_KEY`; do czasu dodania klucza endpoint celowo odpowiada 503. Zeabur env audit: #34245160534.

          '''
          marker = '### Technika / timery postaci — 2026-09-08\n'
          if 'EQ / Torby / Magazyn / screenshot import — 2026-09-08' not in state:
              if marker not in state:
                  raise SystemExit('PROJECT_STATE marker not found')
              state = state.replace(marker, state_entry + marker, 1)
              state_path.write_text(state, encoding='utf-8')

          handoff_path = Path('docs/ai/CURSOR_TO_CHATGPT.md')
          handoff = handoff_path.read_text(encoding='utf-8')
          handoff_entry = '''## EQ / inventory — PR #72

          - Nowy widok: `Założone` + `Torba`, zakładki `Torba I`, `Torba II`, `Magazyn`, większa siatka, panel szczegółów i ręczne zarządzanie.
          - Persistence pozostaje w istniejącym Player Team snapshot sync; nie dodano równoległego storage ani migracji.
          - Screenshot import jest pojedynczym tooltipem i zawsze kończy się draftem do korekty; zapis dopiero po `Potwierdź i dodaj`.
          - `dobry-temat-item-catalog.json` już zawiera wpisy `Ulepszacze`; nie importować ponownie.
          - CI #34244943904 PASS. Zeabur audit #34245160534: `webapp-dest` działa na preview, ale brak `OPENAI_API_KEY`, więc analiza screena pozostaje runtime `PARTIAL` do dodania klucza.

          '''
          marker = '# Cursor / Agent → Owner\n\n'
          if '## EQ / inventory — PR #72' not in handoff:
              if marker not in handoff:
                  raise SystemExit('CURSOR_TO_CHATGPT marker not found')
              handoff = handoff.replace(marker, marker + handoff_entry, 1)
              handoff_path.write_text(handoff, encoding='utf-8')

          env_path = Path('.env.example')
          env = env_path.read_text(encoding='utf-8')
          if 'OPENAI_API_KEY=' not in env:
              env += '''\n# Web — analiza pojedynczego itemu EQ ze screena\n# Sekret ustawiaj wyłącznie w Variables hostingu; nie commituj prawdziwego klucza.\nOPENAI_API_KEY=\n# Opcjonalne; domyślnie aplikacja używa gpt-5.6-luna.\nOPENAI_VISION_MODEL=gpt-5.6-luna\n'''
              env_path.write_text(env, encoding='utf-8')
          PY

      - name: Commit documentation and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/eq-docs-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ai/FIX_LOG.md docs/ai/PROJECT_STATE.md docs/ai/CURSOR_TO_CHATGPT.md .env.example
          git commit -m "docs(ai): record equipment inventory delivery"
          git push origin HEAD:feat/equipment-inventory-screenshot-import-20260908
