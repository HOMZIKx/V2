name: One-shot dependency security update

on:
  push:
    branches:
      - fix/e2e-service-wiring-20260908
    paths:
      - .github/workflows/one-shot-dependency-security-update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/e2e-service-wiring-20260908
          fetch-depth: 0

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Update patched dependencies and lockfile
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const webPath = 'apps/web/package.json';
          const rootPath = 'package.json';
          const web = JSON.parse(fs.readFileSync(webPath, 'utf8'));
          const root = JSON.parse(fs.readFileSync(rootPath, 'utf8'));
          web.dependencies.next = '15.5.24';
          root.pnpm.overrides.sharp = '0.35.4';
          fs.writeFileSync(webPath, JSON.stringify(web, null, 2) + '\n');
          fs.writeFileSync(rootPath, JSON.stringify(root, null, 2) + '\n');
          NODE
          pnpm install --lockfile-only
          pnpm audit --audit-level=high

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/package.json package.json pnpm-lock.yaml
          git diff --cached --check
          git commit -m 'fix(deps): patch Next.js and sharp security advisories'
          git push origin HEAD:fix/e2e-service-wiring-20260908
