name: One-shot Technika docs

on:
  push:
    branches:
      - fix/technika-character-timer-runtime-config-20260908

permissions:
  contents: write

jobs:
  update-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/technika-character-timer-runtime-config-20260908
      - run: python ops/append-technika-docs-once.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ai/FIX_LOG.md docs/ai/PROJECT_STATE.md docs/ai/CURSOR_TO_CHATGPT.md
          git commit -m 'docs(ai): record Technika timer runtime fix'
          git push origin HEAD:fix/technika-character-timer-runtime-config-20260908
