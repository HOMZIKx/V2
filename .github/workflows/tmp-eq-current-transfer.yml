name: Temporary EQ current-base transfer

on:
  push:
    branches:
      - "fix/equipment-hardening-current-20260908"
    paths:
      - ".github/workflows/tmp-eq-current-transfer.yml"

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current-base branch
        uses: actions/checkout@v4
        with:
          ref: fix/equipment-hardening-current-20260908
          fetch-depth: 0
      - name: Reapply EQ hardening without leaked test fixture
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/equipment-post-merge-hardening-20260908
          git cherry-pick dde0cefe5595284e9e092d1cb146219f2663b05b
          git cherry-pick 909b9b792f8c7dabceb75cb9b6c9b7504018c047
          git show origin/fix/equipment-post-merge-hardening-20260908:apps/web/src/player-store-equipment-mutations.spec.ts \
            | sed "s/id: '808066932753563668'/id: 'test-viewer'/; s/discordAccountId: '808066932753563668'/discordAccountId: 'test-discord-account'/" \
            > apps/web/src/player-store-equipment-mutations.spec.ts
          git add apps/web/src/player-store-equipment-mutations.spec.ts
          git commit -m "test(web): cover equipment edit and archive invariants"
          rm .github/workflows/tmp-eq-current-transfer.yml
          git add -A
          git commit -m "chore(ci): remove temporary EQ transfer"
          git push origin HEAD:fix/equipment-hardening-current-20260908
