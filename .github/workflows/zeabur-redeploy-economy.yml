name: Zeabur redeploy economy services
on:
  push:
    branches: [chore/live-route-probe-post-economy-20260909]
    paths: [.github/workflows/zeabur-redeploy-economy.yml]
permissions:
  contents: read
jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy player-team-service and webapp-dest
        env:
          ZEABUR_API_TOKEN: ${{ secrets.zebur }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          token=os.environ['ZEABUR_API_TOKEN'].strip(); endpoint='https://api.zeabur.com/graphql'
          def gql(q,v=None):
            r=subprocess.run(['curl','-sS','--fail-with-body','-X','POST',endpoint,'-H',f'Authorization: Bearer {token}','-H','Content-Type: application/json','--data-binary',json.dumps({'query':q,'variables':v or {}})],capture_output=True,text=True,timeout=40)
            if r.returncode: print('::error::Zeabur request failed');sys.exit(1)
            p=json.loads(r.stdout)
            if p.get('errors'): print('::error::Zeabur GraphQL: '+str(p['errors'][0].get('message','unknown'))[:220]);sys.exit(1)
            return p.get('data') or {}
          root=gql('query{projects{edges{node{_id name}}}}'); ps=[e['node'] for e in root['projects']['edges']]
          p=next((x for x in ps if x['name']=='untitled-1'),None) or (ps[0] if len(ps)==1 else None)
          if not p: print('::error::Project not resolved');sys.exit(1)
          d=gql('query($id:ObjectID!){project(_id:$id){environments{_id name} services{_id name}}}',{'id':p['_id']})['project']
          prod=next((x for x in d['environments'] if x.get('name')=='production'),None)
          if not prod: print('::error::production environment missing');sys.exit(1)
          by_name={x.get('name'):x for x in d['services']}
          targets=['player-team-service','webapp-dest']
          missing=[name for name in targets if name not in by_name]
          if missing: print('::error::Missing redeploy targets: '+','.join(missing));sys.exit(1)
          mutation='mutation($serviceID:ObjectID!,$environmentID:ObjectID!){redeployService(serviceID:$serviceID,environmentID:$environmentID)}'
          for name in targets:
            data=gql(mutation,{'serviceID':by_name[name]['_id'],'environmentID':prod['_id']})
            ok=data.get('redeployService') is True
            print(f'REDEPLOY service={name} accepted={str(ok).lower()}')
            if not ok: sys.exit(2)
          print('ZEABUR_REDEPLOY_ACCEPTED=OK')
          PY
