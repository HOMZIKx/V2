name: Temporary format baseline

on:
  pull_request:
    branches:
      - 'preview/destiled-web'

permissions:
  contents: write

concurrency:
  group: temp-format-baseline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: github.head_ref == 'maintenance/restore-green-ci-20260907'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository formatter
        run: pnpm format

      - name: Commit formatting only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/format-baseline-temp.yml'
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git commit -m "style: format repository baseline"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
