name: Temporary EQ item mutation patch

on:
  push:
    branches:
      - "feat/equipment-inventory-screenshot-import-20260908"
    paths:
      - ".github/workflows/tmp-eq-item-mutations.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/equipment-inventory-screenshot-import-20260908
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch
        run: python .github/scripts/tmp_eq_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(web): complete equipment item editing and archive"
          git push origin HEAD:feat/equipment-inventory-screenshot-import-20260908
