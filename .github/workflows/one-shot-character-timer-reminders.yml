name: One-shot character timer reminders

on:
  push:
    branches:
      - fix/character-timer-reminders-biolog-20260908
    paths:
      - .github/workflows/one-shot-character-timer-reminders.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/character-timer-reminders-biolog-20260908
          fetch-depth: 0
      - name: Apply patch
        run: python3 ops/patch-character-timer-reminders.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src apps/discord-gateway/src docs/ai/FIX_LOG.md
          git diff --cached --check
          git commit -m "fix(timers): add character pre-reminders and Biolog" || exit 0
          git push origin HEAD:fix/character-timer-reminders-biolog-20260908
