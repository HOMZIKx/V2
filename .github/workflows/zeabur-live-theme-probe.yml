name: Zeabur live theme probe

on:
  push:
    branches:
      - ops/redeploy-web-theme-20260909
    paths:
      - .github/workflows/zeabur-live-theme-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed Economy and Party CSS fingerprints
        env:
          ZEABUR_API_TOKEN: ${{ secrets.zebur }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys

          token=os.environ.get('ZEABUR_API_TOKEN','').strip(); endpoint='https://api.zeabur.com/graphql'
          def gql(q,v=None):
            r=subprocess.run(['curl','-sS','--fail-with-body','-X','POST',endpoint,'-H',f'Authorization: Bearer {token}','-H','Content-Type: application/json','--data-binary',json.dumps({'query':q,'variables':v or {}})],capture_output=True,text=True,timeout=40)
            if r.returncode: print('::error::Zeabur transport failed');sys.exit(1)
            p=json.loads(r.stdout)
            if p.get('errors'): print('::error::Zeabur GraphQL: '+str(p['errors'][0].get('message','unknown'))[:220]);sys.exit(1)
            return p.get('data') or {}

          root=gql('query{projects{edges{node{_id name}}}}'); projects=[e['node'] for e in root['projects']['edges']]
          project=next((p for p in projects if p.get('name')=='untitled-1'),None) or (projects[0] if len(projects)==1 else None)
          if not project: print('::error::Project not resolved');sys.exit(1)
          detail=gql('query($id:ObjectID!){project(_id:$id){environments{_id name} services{_id name}}}',{'id':project['_id']})['project']
          production=next((e for e in detail['environments'] if e.get('name')=='production'),None)
          web=next((s for s in detail['services'] if s.get('name')=='webapp-dest'),None)
          if not production or not web: print('::error::Target missing');sys.exit(1)

          node_script=r'''
          async function main(){
            const port=String(process.env.PORT||process.env.WEB_PORT||'3000').trim();
            const origin=`http://127.0.0.1:${port}`;
            const page=await fetch(origin+'/economy',{redirect:'manual',signal:AbortSignal.timeout(7000)});
            const html=await page.text();
            const hrefs=[...html.matchAll(/href=["']([^"']+\.css(?:\?[^"']*)?)["']/g)].map(m=>m[1]);
            const unique=[...new Set(hrefs)];
            let css='';
            for(const href of unique){
              const url=href.startsWith('http')?href:origin+(href.startsWith('/')?href:'/'+href);
              const response=await fetch(url,{signal:AbortSignal.timeout(7000)});
              if(response.ok) css+='\n'+await response.text();
            }
            const normalized=css.toLowerCase().replace(/\s+/g,'');
            const checks={
              ch1_red:normalized.includes('#ff5d6c'),
              ch2_blue:normalized.includes('#4b8cff'),
              economy_gold:normalized.includes('#d4aa55'),
              old_green_surface:normalized.includes('rgba(8,18,17')||normalized.includes('rgba(9,25,22')
            };
            console.log(`economy_status=${page.status} css_files=${unique.length}`);
            console.log(`ch1_red=${checks.ch1_red?'ok':'missing'}`);
            console.log(`ch2_blue=${checks.ch2_blue?'ok':'missing'}`);
            console.log(`economy_gold=${checks.economy_gold?'ok':'missing'}`);
            console.log(`old_green_surface=${checks.old_green_surface?'present':'absent'}`);
            if(page.status!==200||!checks.ch1_red||!checks.ch2_blue||!checks.economy_gold||checks.old_green_surface) process.exitCode=3;
          }
          main().catch((error)=>{console.log(`probe_error=${error?.cause?.code||error?.name||'unknown'}`);process.exitCode=4});
          '''
          execute='mutation($serviceID:ObjectID!,$environmentID:ObjectID!,$command:[String!]!){executeCommand(serviceID:$serviceID,environmentID:$environmentID,command:$command){exitCode output}}'
          out=gql(execute,{'serviceID':web['_id'],'environmentID':production['_id'],'command':['node','-e',node_script]})['executeCommand']
          print(str(out.get('output') or '').strip())
          if out.get('exitCode')!=0: print('::error::Live theme fingerprints mismatch');sys.exit(1)
          print('LIVE_THEME_CSS=OK')
          PY
