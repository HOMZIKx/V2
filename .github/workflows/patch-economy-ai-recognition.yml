name: Patch economy AI recognition
on:
  push:
    branches: [fix/economy-ai-recognition-20260909]
    paths:
      - .github/scripts/patch-economy-ai-recognition.py
      - .github/workflows/patch-economy-ai-recognition.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/economy-ai-recognition-20260909
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@10.14.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Apply patch
        run: python3 .github/scripts/patch-economy-ai-recognition.py
      - name: Format changed files
        run: pnpm exec prettier --write apps/web/app/api/team-economy/recognize/route.ts apps/web/app/economy/private/page.tsx 'apps/web/app/teams/[teamId]/economy/team-economy.tsx' apps/web/src/economy-ai-error.ts apps/web/src/economy-ai-error.spec.ts
      - name: Targeted web validation
        run: |
          pnpm --dir apps/web exec vitest run --config vitest.config.ts src/economy-ai-error.spec.ts
          pnpm --dir apps/web typecheck
      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name HOMZIKx
          git config user.email ciborex12@gmail.com
          git add apps/web/app/api/team-economy/recognize/route.ts apps/web/app/economy/private/page.tsx 'apps/web/app/teams/[teamId]/economy/team-economy.tsx' apps/web/src/economy-ai-error.ts apps/web/src/economy-ai-error.spec.ts
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
            exit 0
          fi
          git commit -m 'fix(economy): make AI screenshot recognition resilient'
          git push origin HEAD:fix/economy-ai-recognition-20260909
