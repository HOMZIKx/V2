name: Clean one-shot economy audit workflows

on:
  push:
    branches: [fix/e2e-service-wiring-20260908]
    paths: [.github/workflows/cleanup-economy-audit-workflows.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/e2e-service-wiring-20260908
      - name: Remove one-shot audit workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/zeabur-e2e-wiring-probe.yml \
            .github/workflows/zeabur-player-team-buildlog-probe.yml \
            .github/workflows/zeabur-player-team-deployments-probe.yml \
            .github/workflows/zeabur-player-team-recover.yml \
            .github/workflows/zeabur-player-team-redeploy.yml \
            .github/workflows/zeabur-player-team-source-probe.yml \
            .github/workflows/zeabur-web-player-route-probe.yml \
            .github/workflows/apply-economy-runtime-fixes.yml \
            .github/workflows/cleanup-economy-audit-workflows.yml
          git config user.name 'HOMZIKx'
          git config user.email 'ciborex12@gmail.com'
          git add -A .github/workflows
          git commit -m 'chore(ci): remove one-shot economy audit workflows'
          git push origin HEAD:fix/e2e-service-wiring-20260908
