openapi: 3.1.0
info:
  title: Activity Service API
  version: 1.2.0
  description: P4.1–P4.3 activity-service HTTP API (`/activity/v1` + `/activity/v1/admin`).
servers:
  - url: http://127.0.0.1:4400
paths:
  /health/live:
    get:
      summary: Liveness
      responses:
        '200':
          description: OK
  /health/ready:
    get:
      summary: Readiness (DB ping)
      responses:
        '200':
          description: Ready
        '503':
          description: Database unavailable
  /activity/v1/drafts:
    post:
      summary: Create activity draft (24h TTL)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Draft created
  /activity/v1/drafts/by-opaque/{opaqueId}:
    get:
      summary: Get draft by opaque id prefix
      responses:
        '200':
          description: Draft
  /activity/v1/drafts/{id}:
    get:
      summary: Get draft
      parameters:
        - $ref: '#/components/parameters/DraftId'
      responses:
        '200':
          description: Draft
    patch:
      summary: Update draft payload
      parameters:
        - $ref: '#/components/parameters/DraftId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Updated
    delete:
      summary: Discard draft
      parameters:
        - $ref: '#/components/parameters/DraftId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Discarded
  /activity/v1/drafts/{id}/publish:
    post:
      summary: Publish draft into an activity
      parameters:
        - $ref: '#/components/parameters/DraftId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Activity created
  /activity/v1/activities:
    get:
      summary: List guild activities
      parameters:
        - name: guildId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Activities
  /activity/v1/activities/{id}:
    get:
      summary: Get activity
      parameters:
        - $ref: '#/components/parameters/ActivityId'
      responses:
        '200':
          description: Activity
    patch:
      summary: Edit activity
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Updated
    delete:
      summary: Permanent delete (before start, zero participants)
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Deleted
  /activity/v1/activities/{id}/cancel:
    post:
      summary: Cancel activity (reason required)
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Cancelled
  /activity/v1/activities/{id}/enrollment/open:
    post:
      summary: Open enrollment
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Opened
  /activity/v1/activities/{id}/enrollment/close:
    post:
      summary: Close enrollment
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Closed
  /activity/v1/activities/{id}/rsvp:
    post:
      summary: RSVP / waitlist
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Participation upserted
  /activity/v1/activities/{id}/resign:
    post:
      summary: Resign participation
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Resigned
  /activity/v1/activities/{id}/participants:
    get:
      summary: List participants
      parameters:
        - $ref: '#/components/parameters/ActivityId'
      responses:
        '200':
          description: Participants
  /activity/v1/activities/{id}/participants/remove:
    post:
      summary: Remove participant
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Removed
  /activity/v1/activities/{id}/co-organizer:
    post:
      summary: Assign co-organizer (max 1)
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Assigned
  /activity/v1/activities/{id}/takeover:
    post:
      summary: Take over as organizer (manage.guild)
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Taken over
  /activity/v1/activities/{id}/start:
    post:
      summary: Start activity
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Started
  /activity/v1/activities/{id}/finish:
    post:
      summary: Finish activity
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Finished
  /activity/v1/activities/{id}/reschedule:
    post:
      summary: Reschedule (requires_reconfirmation)
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Rescheduled
  /activity/v1/activities/{id}/reconfirm:
    post:
      summary: Reconfirm participation after schedule change
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Reconfirmed
  /activity/v1/maintenance/expire-reconfirmations:
    post:
      summary: Expire overdue reconfirmations and promote waitlist
      responses:
        '200':
          description: Processed
  /activity/v1/maintenance/finish-due:
    post:
      summary: Auto-finish due activities
      responses:
        '200':
          description: Processed
  /activity/v1/guilds/{guildId}/config:
    get:
      summary: Read guild activity config
      parameters:
        - $ref: '#/components/parameters/GuildId'
      responses:
        '200':
          description: Config
    put:
      summary: Update guild activity config (config.manage)
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Updated
  /activity/v1/guilds/{guildId}/ensure-defaults:
    post:
      summary: Ensure default status defs and settings
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Defaults ensured
  /activity/v1/panels:
    get:
      summary: List panels for guild
      parameters:
        - name: guildId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Panels
    post:
      summary: Upsert panel state (no Discord send)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Panel
  /activity/v1/panels/{id}:
    get:
      summary: Get panel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Panel
  /activity/v1/outbox/claim:
    post:
      summary: Claim outbox messages (test/admin; worker off by default)
      responses:
        '200':
          description: Claimed
  /activity/v1/outbox/{id}/complete:
    post:
      summary: Mark outbox delivered
      responses:
        '200':
          description: Delivered
  /activity/v1/outbox/{id}/fail:
    post:
      summary: Mark outbox failed / retry
      responses:
        '200':
          description: Re-queued
  /activity/v1/me/activities:
    get:
      summary: Activities for the actor
      parameters:
        - name: guildId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Activities
  /activity/v1/inbox:
    get:
      summary: List private notification inbox for the actor
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Inbox page
  /activity/v1/inbox/{id}/read:
    post:
      summary: Mark inbox item read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Inbox item
  /activity/v1/activities/by-opaque/{opaqueId}:
    get:
      summary: Get activity by opaque id
      parameters:
        - name: opaqueId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{12}$'
      responses:
        '200':
          description: Activity
  /activity/v1/panels/by-opaque/{opaqueId}:
    get:
      summary: Get hub panel by opaque id
      parameters:
        - name: opaqueId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{12}$'
      responses:
        '200':
          description: Panel
  /activity/v1/activities/{id}/reports:
    post:
      summary: Create activity report
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Report created
  /activity/v1/guilds/{guildId}/reports:
    get:
      summary: List guild reports (manage.guild or report.manage)
      parameters:
        - $ref: '#/components/parameters/GuildId'
      responses:
        '200':
          description: Reports
  /activity/v1/activities/{id}/projection:
    get:
      summary: Get Discord projection row for activity
      parameters:
        - $ref: '#/components/parameters/ActivityId'
      responses:
        '200':
          description: Projection
    put:
      summary: Upsert Discord projection row
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Projection upserted
  /activity/v1/test/seed-guild:
    post:
      summary: Test-only guild seed (non-production; requires ACTIVITY_ALLOW_TEST_SEED=true)
      description: |
        **Test-only.** Disabled when `NODE_ENV=production` or `ACTIVITY_ALLOW_TEST_SEED` is not true.
        Must not overwrite admin-owned channel config (configRevision > 1 or existing allowed channels).
        Rejects guildIds that match forbidden hardcoded domain constants.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Seeded (test-only)
        '403':
          description: Seed disabled (production or allowTestSeed false)
  /activity/v1/admin/guilds/{guildId}/config:
    get:
      summary: Get guild admin config
      parameters:
        - $ref: '#/components/parameters/GuildId'
      responses:
        '200':
          description: Admin config
    put:
      summary: Put guild admin config (expectedRevision / If-Match)
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Updated
        '409':
          description: Config revision conflict
  /activity/v1/admin/guilds/{guildId}/readiness:
    get:
      summary: Guild admin readiness (READY / NOT_READY + issues)
      parameters:
        - $ref: '#/components/parameters/GuildId'
      responses:
        '200':
          description: Readiness
  /activity/v1/admin/guilds/{guildId}/types:
    get:
      summary: List activity types
      parameters:
        - $ref: '#/components/parameters/GuildId'
      responses:
        '200':
          description: Types
    post:
      summary: Create activity type
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Created
  /activity/v1/admin/guilds/{guildId}/types/{typeId}:
    patch:
      summary: Update activity type
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - name: typeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Updated
    delete:
      summary: Soft-deactivate activity type (keeps history)
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - name: typeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Deactivated
  /activity/v1/admin/guilds/{guildId}/statuses:
    get:
      summary: List participation status defs
      parameters:
        - $ref: '#/components/parameters/GuildId'
      responses:
        '200':
          description: Statuses
    post:
      summary: Create status def
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Created
  /activity/v1/admin/guilds/{guildId}/statuses/{statusId}:
    patch:
      summary: Update status def
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - name: statusId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Updated
    delete:
      summary: Soft-deactivate status def (protected if referenced)
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - name: statusId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Deactivated
        '409':
          description: Status is referenced by config
  /activity/v1/admin/guilds/{guildId}/participant-fields:
    get:
      summary: List participant field defs
      parameters:
        - $ref: '#/components/parameters/GuildId'
      responses:
        '200':
          description: Fields
    post:
      summary: Create participant field def
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Created
  /activity/v1/admin/guilds/{guildId}/participant-fields/{fieldId}:
    patch:
      summary: Update participant field def
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - name: fieldId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Updated
    delete:
      summary: Soft-deactivate participant field def
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - name: fieldId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Deactivated
  /activity/v1/admin/guilds/{guildId}/report-reasons:
    get:
      summary: List report reason defs
      parameters:
        - $ref: '#/components/parameters/GuildId'
      responses:
        '200':
          description: Reasons
    post:
      summary: Create report reason def
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Created
  /activity/v1/admin/guilds/{guildId}/report-reasons/{reasonId}:
    patch:
      summary: Update report reason def
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - name: reasonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Updated
    delete:
      summary: Soft-deactivate report reason def
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - name: reasonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Deactivated
  /activity/v1/admin/guilds/{guildId}/channels:
    get:
      summary: Get allowed publish channels
      parameters:
        - $ref: '#/components/parameters/GuildId'
      responses:
        '200':
          description: Channels
    put:
      summary: Set allowed publish channels
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Updated
        '409':
          description: Config revision conflict
  /activity/v1/admin/guilds/{guildId}/ping-roles:
    get:
      summary: Get allowed ping role ids
      parameters:
        - $ref: '#/components/parameters/GuildId'
      responses:
        '200':
          description: Ping roles
    put:
      summary: Set allowed ping role ids
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Updated
        '409':
          description: Config revision conflict
  /activity/v1/admin/guilds/{guildId}/events:
    get:
      summary: List admin events (filters + pagination)
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - name: status
          in: query
          schema:
            type: string
        - name: organizerDiscordUserId
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Events page
  /activity/v1/admin/guilds/{guildId}/events/{activityId}:
    get:
      summary: Get admin event detail
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - name: activityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Event detail
  /activity/v1/admin/guilds/{guildId}/events/{activityId}/cancel:
    post:
      summary: Cancel event (manage.guild via cancel use case)
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - name: activityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Cancelled
  /activity/v1/admin/guilds/{guildId}/events/{activityId}/takeover:
    post:
      summary: Take over event organization (manage.guild)
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - name: activityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Taken over
  /activity/v1/admin/guilds/{guildId}/projections:
    get:
      summary: List projection problems
      parameters:
        - $ref: '#/components/parameters/GuildId'
      responses:
        '200':
          description: Problems
    post:
      summary: Request re-projection for all problem rows
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Scan requested
  /activity/v1/admin/guilds/{guildId}/projections/{activityId}/repair:
    post:
      summary: Repair projection (upsert + outbox)
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - name: activityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Repair enqueued
  /activity/v1/admin/guilds/{guildId}/reports:
    get:
      summary: List reports (open/resolved filter)
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - name: status
          in: query
          schema:
            type: string
            enum: [open, resolved]
      responses:
        '200':
          description: Reports
  /activity/v1/admin/guilds/{guildId}/reports/{reportId}:
    patch:
      summary: Update report status
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Updated
  /activity/v1/admin/guilds/{guildId}/audit:
    get:
      summary: List audit entries (filters + pagination)
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - name: actionPrefix
          in: query
          schema:
            type: string
        - name: activityId
          in: query
          schema:
            type: string
            format: uuid
        - name: actorDiscordUserId
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Audit page
  /activity/v1/admin/guilds/{guildId}/hub:
    get:
      summary: Get hub status / desired channel
      parameters:
        - $ref: '#/components/parameters/GuildId'
      responses:
        '200':
          description: Hub status
  /activity/v1/admin/guilds/{guildId}/hub/publish-intent:
    post:
      summary: Store desired hub channel (Discord publish stays gateway)
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Intent stored
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
      description: Config revision (alternative to body expectedRevision)
    DraftId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActivityId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GuildId:
      name: guildId
      in: path
      required: true
      schema:
        type: string
  schemas:
    ActivityEventNames:
      type: string
      enum:
        - activity.activity.created.v1
        - activity.activity.rsvp_changed.v1
        - activity.activity.cancelled.v1
        - activity.activity.schedule_changed.v1
        - activity.activity.waitlist_promoted.v1
        - activity.activity.reconfirm_required.v1
        - activity.activity.finished.v1
